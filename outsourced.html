<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>if(sessionStorage.getItem("koti_authed")!=="1"){location.href="login.html";}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위탁과제 관리 · AI빅데이터연구팀</title>
<style>
  :root{
    --navy:#16265e; --navy-2:#1a2942; --blue:#2c5fbf; --blue-soft:#e8eefb;
    --red:#c8273c; --red-soft:#fdeaec; --green:#1f8a5b; --green-soft:#e3f5ec;
    --orange:#b9770a; --orange-soft:#fff4e0; --purple:#7a4ec2; --purple-soft:#efeafa;
    --bg:#eef1f6; --surface:#ffffff; --line:#dfe5ef; --line-2:#cdd6ec;
    --text:#16265e; --text-2:#5a6680; --muted:#9fb0cf;
    --shadow:0 1px 3px rgba(16,38,94,.06),0 8px 24px rgba(16,38,94,.07);
    --radius:6px; --maxw:1500px;
  }
  html[data-theme="dark"]{
    --navy:#0d1836; --navy-2:#0a1228; --blue:#5b8def; --blue-soft:#16233f;
    --red:#ff7a7a; --red-soft:#3a1717; --green:#43c794; --green-soft:#103024;
    --orange:#e0a94a; --orange-soft:#3a2c17; --purple:#a888e0; --purple-soft:#241a3a;
    --bg:#0a1020; --surface:#111c33; --line:#1e2d4d; --line-2:#26375c;
    --text:#e7eef7; --text-2:#a8b6d4; --muted:#6b7ba0;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo",-apple-system,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 120px}

  .utilbar{background:var(--navy-2);color:#cdd6ec;font-size:12.5px}
  .utilbar .in{max-width:var(--maxw);margin:0 auto;padding:7px 120px;display:flex;justify-content:flex-end;gap:16px;align-items:center}
  .utilbar a{color:#cdd6ec;text-decoration:none}
  .utilbar .sep{color:#3a4a72}
  .util-toggle{background:none;border:none;color:#cdd6ec;cursor:pointer;font-size:12.5px}

  .head{background:var(--surface);border-bottom:1px solid var(--line)}
  .head .in{max-width:var(--maxw);margin:0 auto;padding:16px 120px;display:flex;align-items:center;gap:16px}
  .logo{height:44px}
  .head h1{font-size:20px;font-weight:800;margin:0;color:var(--navy)}
  .head-actions{margin-left:auto;display:flex;gap:10px}
  .hbtn{font-size:13.5px;font-weight:700;padding:9px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--line-2);
    background:var(--surface);color:var(--navy)}
  .hbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .hbtn:hover{filter:brightness(.97)}

  nav.tabs{background:var(--navy)}
  nav.tabs .in{max-width:var(--maxw);margin:0 auto;padding:0 120px;display:flex;gap:2px;flex-wrap:wrap}
  nav.tabs a{color:#b9c8e8;text-decoration:none;font-size:14.5px;font-weight:700;padding:14px 20px;border-bottom:3px solid transparent}
  nav.tabs a:hover{color:#fff}
  nav.tabs a.cur{color:#fff;background:var(--blue);border-bottom-color:#fff}

  .ptitle{padding:26px 0 18px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .ptitle .crumb{font-size:12.5px;color:var(--text-2);font-weight:600}
  .ptitle h2{font-size:26px;font-weight:850;margin:2px 0 0;color:var(--navy)}
  .year-nav{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line-2);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow)}
  .year-nav button{border:none;background:none;color:var(--navy);cursor:pointer;font-size:16px;padding:2px 6px}
  .year-nav .ylabel{font-size:14px;font-weight:800;color:var(--navy);min-width:80px;text-align:center}

  .filterbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .filterbar .flabel{font-size:13px;font-weight:800;color:var(--navy);margin-right:2px}
  .filterbar select{border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:13px;
    background:var(--surface);color:var(--text);font-family:inherit}
  .filterbar .cnt{margin-left:auto;font-size:13px;color:var(--text-2);font-weight:600}
  .filterbar .reset{border:1px solid var(--line-2);background:var(--surface);color:var(--navy);border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}

  /* 요약 카드 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px}
  .kpi .k-lab{font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:8px}
  .kpi .k-val{font-size:28px;font-weight:850;color:var(--navy)}
  .kpi .k-val span{font-size:14px;font-weight:700;color:var(--text-2);margin-left:3px}
  .kpi.ongoing .k-val{color:var(--blue)}
  .kpi.done .k-val{color:var(--green)}
  .kpi.hold .k-val{color:var(--orange)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
  .card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card-h .bar{width:4px;height:18px;background:var(--blue);border-radius:2px}
  .card-h h3{font-size:16px;font-weight:800;margin:0;color:var(--navy)}
  .card-h .sub{font-size:12.5px;color:var(--text-2);font-weight:600}
  .card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .addbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--navy);border-radius:8px;
    padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
  .addbtn:hover{background:var(--blue-soft)}

  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
  .tbl th{text-align:center;font-size:12px;font-weight:800;color:var(--text-2);padding:11px 14px;border-bottom:2px solid var(--line);white-space:nowrap}
  .tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center;overflow:hidden;text-overflow:ellipsis}
  .tbl th:nth-child(1),.tbl td:nth-child(1){width:5%}
  .tbl th:nth-child(2),.tbl td:nth-child(2){width:12%}
  .tbl th:nth-child(3),.tbl td:nth-child(3){width:23%}
  .tbl th:nth-child(4),.tbl td:nth-child(4){width:20%}
  .tbl th:nth-child(5),.tbl td:nth-child(5){width:8%}
  .tbl th:nth-child(6),.tbl td:nth-child(6){width:11%}
  .tbl th:nth-child(7),.tbl td:nth-child(7){width:13%}
  .tbl th:nth-child(8),.tbl td:nth-child(8){width:8%}
  .tbl tbody tr{cursor:pointer;transition:background .12s}
  .tbl tbody tr:hover{background:var(--blue-soft)}
  .tbl .col-no{color:var(--muted);font-weight:700}
  .tbl .t-title{font-weight:700;color:var(--navy);text-align:center}
  .tbl .t-sub{color:var(--text-2)}
  .ptag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:4px;white-space:nowrap}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:4px;white-space:nowrap}
  .empty-row td{text-align:center;color:var(--muted);padding:26px;font-size:13px}

  /* 진행률 바 */
  .prog{display:flex;align-items:center;gap:8px;justify-content:center}
  .prog-bar{flex:1;max-width:90px;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .prog-fill{height:100%;background:var(--blue);border-radius:4px}
  .prog-pct{font-size:12px;font-weight:700;color:var(--text-2);min-width:34px;text-align:right}
  .badge.done{background:var(--green);color:#fff}
  .badge.hold{background:var(--orange);color:#fff}

  .state{padding:48px;text-align:center;color:var(--text-2)}
  /* 모달 */
  .ov{display:none;position:fixed;inset:0;background:rgba(10,20,45,.5);z-index:300;align-items:center;justify-content:center;padding:20px}
  .ov.open{display:flex}
  .modal{background:var(--surface);border-radius:10px;width:100%;max-width:860px;max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.3);animation:mpop .16s ease}
  @keyframes mpop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .modal-head{background:var(--navy);color:#fff;font-size:16px;font-weight:800;padding:16px 22px;
    display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0}
  .modal-head .x{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .mbtn{font-size:13.5px;font-weight:700;padding:9px 18px;border-radius:7px;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--navy)}
  .mbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .mbtn.danger{background:var(--surface);color:var(--red);border-color:var(--red)}
  .mbtn:hover{filter:brightness(.97)}
  /* 폼 */
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld>span{font-size:12.5px;font-weight:700;color:var(--text-2)}
  .fld>span b{color:var(--red)}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:6px;padding:9px 11px;font-size:13.5px;
    background:var(--surface);color:var(--text);font-family:inherit;resize:vertical}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(44,95,191,.13)}
  .agenda-edit{width:100%;min-height:180px;border:1px solid var(--line-2);border-radius:6px;padding:11px 13px;font-size:13px;
    background:var(--surface);color:var(--text);font-family:inherit;resize:vertical;line-height:1.7;white-space:pre}
  .fld-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  /* 체크리스트 */
  .chk-head{display:flex;align-items:center;justify-content:space-between}
  .chk-head .chk-lab{font-size:12.5px;font-weight:700;color:var(--text-2)}
  .chk-head .chk-cnt{font-size:12px;font-weight:700;color:var(--blue)}
  .chk-list{display:flex;flex-direction:column;gap:7px;margin-top:2px}
  .chk-item{display:flex;align-items:center;gap:9px}
  .chk-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex:none}
  .chk-item input[type=text]{flex:1;border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;font-size:13px;
    background:var(--surface);color:var(--text);font-family:inherit}
  .chk-item .chk-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;flex:none}
  .chk-item .chk-del:hover{color:var(--red)}
  .chk-add{border:1px dashed var(--line-2);background:var(--surface);color:var(--blue);border-radius:6px;
    padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:4px}
  .chk-add:hover{background:var(--blue-soft)}
  .estatus{margin:0}
  .edit-hint{font-size:11px;color:var(--muted);margin-bottom:7px}
  .crop-block{border:1px solid var(--line-2);border-radius:6px;padding:8px;margin-bottom:8px}
  .crop-block .crop-tools{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .crop-canvas-wrap{position:relative;max-width:100%;overflow:auto;border:1px dashed var(--line-2);cursor:crosshair}
  .crop-canvas-wrap canvas{display:block;max-width:100%}
  .crop-sel{position:absolute;border:2px solid #2c5fbf;background:rgba(44,95,191,.15);pointer-events:none}
  .crop-status{font-size:11px;color:var(--muted)}
  .status{font-size:13px;padding:9px 13px;border-radius:6px;display:none}
  .status.show{display:block}
  .status.info{background:var(--blue-soft);color:var(--blue)}
  .status.err{background:var(--red-soft);color:var(--red)}
  .status.ok{background:var(--green-soft);color:var(--green)}
  /* 상세 보기 */
  .v-title{font-size:19px;font-weight:850;color:var(--navy);margin-bottom:16px}
  .v-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
  .v-item .v-lab{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:2px}
  .v-item .v-val{font-size:14px;font-weight:600;color:var(--text)}
  .v-full{grid-column:1/3}
  .v-chk{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
  .v-chk .vc-item{font-size:13.5px;display:flex;gap:8px;align-items:center;padding:2px 0}
  .v-chk .vc-item.done{color:var(--muted);text-decoration:line-through}
  footer{padding:30px 0 48px;color:var(--muted);font-size:13px;text-align:center}

  @media(max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
<style>
  /* 과제 탭 */
  .ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .ptab{cursor:pointer;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px;
    border:1px solid var(--line-2);background:var(--surface);color:var(--text-2)}
  .ptab:hover{background:var(--blue-soft)}
  .ptab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  /* 과제 정보띠 */
  .info-strip{display:flex;align-items:center;gap:0;flex-wrap:wrap;background:var(--navy);border-radius:8px;
    padding:14px 20px;margin-bottom:16px;color:#dbe3f4}
  .info-strip .title{font-size:16px;font-weight:800;color:#fff;margin-right:18px}
  .info-meta{display:flex;align-items:center;gap:8px;padding:0 16px}
  .info-meta.first{padding-left:0}
  .info-lab{font-size:11px;font-weight:700;color:#8fa0c8}
  .info-val{font-size:12.5px;font-weight:600;color:#fff}
  .info-sep{width:1px;height:14px;background:#33437a}

  /* 서브탭(회의록/요청자료) */
  .subtabs{display:flex;gap:4px;border-bottom:2px solid var(--line-2);margin-bottom:16px}
  .subtab{cursor:pointer;font-size:13.5px;font-weight:700;padding:11px 16px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-2px}
  .subtab:hover{color:var(--navy)}
  .subtab.on{color:var(--navy);border-bottom-color:var(--navy)}

  .sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sec-h .sub{font-size:12px;color:var(--muted);font-weight:500}
  .addbtn{font-size:12px;font-weight:700;color:#fff;background:var(--blue);border:none;border-radius:4px;padding:9px 16px;cursor:pointer}
  .addbtn:hover{filter:brightness(.95)}

  /* 배지 */
  .tag{display:inline-block;padding:3px 9px;border-radius:3px;font-size:11px;font-weight:700;white-space:nowrap}
  .kindb{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}

  /* 회의록 표 */
  .tbl.cm{table-layout:fixed;background:var(--surface);border:1px solid var(--line)}
  .tbl.cm th,.tbl.cm td{text-align:center}
  .tbl.cm th:nth-child(1),.tbl.cm td:nth-child(1){width:4%}
  .tbl.cm th:nth-child(2),.tbl.cm td:nth-child(2){width:10%}
  .tbl.cm th:nth-child(3),.tbl.cm td:nth-child(3){width:8%}
  .tbl.cm th:nth-child(4),.tbl.cm td:nth-child(4){width:7%}
  .tbl.cm th:nth-child(5),.tbl.cm td:nth-child(5){width:10%}
  .tbl.cm th:nth-child(6),.tbl.cm td:nth-child(6){width:auto;text-align:left}
  .tbl.cm th:nth-child(7),.tbl.cm td:nth-child(7){width:20%}
  .tbl.cm tbody tr{cursor:pointer}
  .tbl.cm tbody tr:hover{background:var(--blue-soft)}

  /* 요청자료 카드 */
  .req-card{background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:14px;cursor:pointer}
  .req-card:hover{border-color:var(--line-2)}
  .req-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
  .req-h .l{display:flex;align-items:center;gap:10px;min-width:0}
  .req-h .title{font-size:15px;font-weight:700;color:var(--navy)}
  .req-h .r{display:flex;align-items:center;gap:12px;flex:none}
  .req-h .meta{font-size:11.5px;color:var(--muted)}
  .req-edit{font-size:11.5px;font-weight:600;color:var(--blue)}
  .req-body{padding:16px 18px}
  .req-files{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .filechip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:4px;padding:6px 10px;text-decoration:none}
  a.filechip{cursor:pointer}
  a.filechip:hover{filter:brightness(.95)}
  .filechip.req{color:#5a6680;background:var(--subtle);border:1px solid var(--line-2)}
  .filechip.reply{color:#c8273c;background:#fdecee;border:1px solid #f3d2d7}
  .qa-item{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;background:var(--subtle);border:1px solid var(--line-2);border-radius:6px;margin-bottom:8px}
  .qa-n{flex-shrink:0;font-size:10.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:4px 8px;margin-top:1px}
  .qa-q{font-size:13px;font-weight:600;color:var(--navy);line-height:1.55;white-space:pre-wrap}
  .qa-empty{font-size:12px;color:var(--muted);padding:14px 2px;text-align:center;border:1px dashed var(--line-2);border-radius:6px}

  /* 상세(회신 답변 포함) 모달 내 QA */
  .qa-detail{border:1px solid var(--line-2);border-radius:7px;overflow:hidden;margin-bottom:12px}
  .modal.modal-wide{max-width:920px}
  .req-view-grid{display:grid;grid-template-columns:280px 1fr;gap:0}
  .fig-col{border-right:1px solid var(--line-2);padding:18px;background:var(--bg)}
  .fig-col .fig-lab{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:10px;letter-spacing:.03em}
  .fig-item{margin-bottom:14px;cursor:zoom-in}
  .fig-item img{width:100%;border-radius:6px;border:1px solid var(--line-2);display:block}
  .fig-cap{font-size:10.5px;color:var(--muted);margin-top:5px;text-align:center;line-height:1.4}
  .fig-label{font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:8px;
    padding:2px 8px;display:inline-block;margin-bottom:6px}
  .fig-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:20px 4px}
  .fig-broken,.fig-broken-msg{font-size:10.5px;color:var(--red);text-align:center;padding:14px 8px;border:1px dashed var(--red);border-radius:6px;margin-bottom:14px;background:#fdf0ef}
  .fig-loading{font-size:11px;color:var(--muted);text-align:center;padding:20px 8px;border:1px solid var(--line-2);border-radius:6px;margin-bottom:14px;background:var(--bg)}
  .fig-broken-url{display:block;font-size:9px;word-break:break-all;opacity:.8;margin-top:4px}
  .file-pick-row{display:flex;gap:6px}
  .file-pick-row input[type=text]{flex:1}
  .file-pick-btn{flex:none;font-size:12px;font-weight:600;color:var(--blue);border:1px solid var(--line-2);background:var(--bg);border-radius:6px;padding:0 12px;cursor:pointer}
  .file-pick-status{font-size:10.5px;margin-top:4px}
  .file-pick-status.up{color:var(--blue);font-weight:600}
  .file-pick-status.ok{color:#1f8a5b;font-weight:600}
  .file-pick-status.err{color:var(--red);font-weight:600}
  .qa-col{padding:18px 20px;max-height:64vh;overflow-y:auto}
  .lightbox{position:fixed;inset:0;background:rgba(8,14,30,.82);display:none;align-items:center;justify-content:center;

<script>
  var WORKER_URL = "https://notion-proxy.ekqls0458.workers.dev";
  var KIND_LIST = ["월간회의","실무진회의","보고","기타"];
  var KIND_STYLE = { "월간회의":{c:"#fff",bg:"#16265e"}, "실무진회의":{c:"#2c5fbf",bg:"#e8eefb"}, "보고":{c:"#8a3fb0",bg:"#f3e8fa"}, "기타":{c:"#5a6680",bg:"#eef1f6"} };
  var MSTATUS_STYLE = { "완료":{c:"#fff",bg:"#1f8a5b"}, "예정":{c:"#b9770a",bg:"#fff4e0"} };
  var MODE_STYLE = { "화상":{c:"#3a5bbf",bg:"#eef2fb"}, "대면":{c:"#3f7a5a",bg:"#eef3ef"} };
  var DOW = ["일","월","화","수","목","금","토"];

  var DATA = { consignments:[], meetings:[] };
  var YEAR = new Date().getFullYear();
  var SEL = null;
  var MFILTER = { search:"", type:"전체", status:"전체" };
  var MEDIT = { id:null, mode:"view" };
  var pendingConsignImages = []; // [{ dataUrl, filename }] — PDF에서 크롭해 담아둔 표/그림, 저장 시 함께 업로드

  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  // 규칙 기반 핵심 문구 강조: [결정]/[요청]/[이슈]/[완료]/[중요] 태그가 붙은 문장 + 숫자·단위(%, 시간, 건, 명, 원 등)
  function highlightText(raw){
    if(!raw) return "";
    var spans=[];
    var re1=/\[(?:결정|요청|이슈|완료|중요)\][^\n]*/g, m;
    while((m=re1.exec(raw))){ spans.push([m.index, m.index+m[0].length]); }
    var re2=/\d+(?:\.\d+)?\s*(?:%|퍼센트|시간|건|명|원|개|배|주|일|개월|km|kg|fps|Hz)/g;
    while((m=re2.exec(raw))){
      var s=m.index, e=m.index+m[0].length;
      if(!spans.some(function(sp){ return s>=sp[0] && e<=sp[1]; })) spans.push([s,e]);
    }
    spans.sort(function(a,b){ return a[0]-b[0]; });
    var merged=[];
    spans.forEach(function(sp){
      if(merged.length && sp[0]<=merged[merged.length-1][1]) merged[merged.length-1][1]=Math.max(merged[merged.length-1][1], sp[1]);
      else merged.push(sp.slice());
    });
    var out="", pos=0;
    merged.forEach(function(sp){
      out += esc(raw.slice(pos, sp[0]));
      out += '<mark class="hl">'+esc(raw.slice(sp[0], sp[1]))+'</mark>';
      pos = sp[1];
    });
    out += esc(raw.slice(pos));
    return out;
  }
  function pad2(n){ return (n<10?"0":"")+n; }
  function parseYMD(s){ if(!s) return null; var p=s.slice(0,10).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function fmtMDW(s){ var d=parseYMD(s); return d?pad2(d.getMonth()+1)+"."+pad2(d.getDate())+"("+DOW[d.getDay()]+")":"-"; }
  function fmtYM(s){ if(!s) return ""; return s.slice(2,4)+"."+s.slice(5,7); }
  function yearOf(s){ return s?parseInt(s.slice(0,4),10):null; }

  function tagSpan(text, st){ return "<span class=\"tag\" style=\"color:"+st.c+";background:"+st.bg+"\">"+esc(text)+"</span>"; }
  function kindBadge(k){ var st=KIND_STYLE[k]||KIND_STYLE["기타"]; return "<span class=\"kindb\" style=\"color:"+st.c+";background:"+st.bg+"\">"+esc(k)+"</span>"; }
  function mstatBadge(s){ var st=MSTATUS_STYLE[s]||MSTATUS_STYLE["예정"]; return "<span class=\"kindb\" style=\"color:"+st.c+";background:"+st.bg+"\">"+esc(s)+"</span>"; }
  function modeBadge(m){ var st=MODE_STYLE[m]||MODE_STYLE["대면"]; return "<span class=\"kindb\" style=\"color:"+st.c+";background:"+st.bg+"\">"+esc(m)+"</span>"; }

  function periodYears(c){ return [yearOf(c.start), yearOf(c.end)]; }
  function inYear(c, y){
    var r=periodYears(c);
    if(r[0]==null) return true;
    return y>=r[0] && y<=r[1];
  }
  function yearBounds(){
    var mn=Infinity, mx=-Infinity;
    DATA.consignments.forEach(function(c){
      var r=periodYears(c);
      if(r[0]!=null){ mn=Math.min(mn,r[0]); mx=Math.max(mx,r[1]); }
    });
    if(mn===Infinity) return [YEAR,YEAR];
    return [mn,mx];
  }
  function curConsignment(){ return DATA.consignments.filter(function(c){return c.id===SEL;})[0] || null; }
  function meetingsOf(id){ return DATA.meetings.filter(function(m){return m.project===id;}); }
  async function load(){
    document.getElementById("content").innerHTML="<div class=\"state\">불러오는 중…</div>";
    try {
      var res=await fetch(WORKER_URL+"?scope=outsourced",{cache:"no-store"});
      var data=await res.json();
      DATA.consignments=data.consignments||[];
      DATA.meetings=data.consignMeetings||[];
      DATA.errorSrc = data.consignError ? "위탁과제 정보" : (data.consignMeetingError ? "위탁과제 회의록" : "");
      DATA.error = data.consignError || data.consignMeetingError || "";
      var yb=yearBounds();
      if(YEAR<yb[0]) YEAR=yb[1]; if(YEAR>yb[1]) YEAR=yb[1];
      var qProject = new URLSearchParams(location.search).get("project");
      if(qProject && DATA.consignments.some(function(c){return c.id===qProject;})){
        SEL = qProject;
        var qc = DATA.consignments.filter(function(c){return c.id===qProject;})[0];
        var yr=periodYears(qc); if(yr[0]!=null && (YEAR<yr[0]||YEAR>yr[1])) YEAR=yr[0];
      } else {
        var avail=DATA.consignments.filter(function(c){return inYear(c,YEAR);});
        if(!avail.some(function(c){return c.id===SEL;})) SEL = avail.length ? avail[0].id : null;
      }
      render();
    } catch(e){
      document.getElementById("content").innerHTML="<div class=\"state\">불러오기 실패: "+esc(String(e))+"</div>";
    }
  }

  function buildTabs(){
    var avail=DATA.consignments.filter(function(c){return inYear(c,YEAR);});
    document.getElementById("ptabs").innerHTML = avail.length ? avail.map(function(c){
      return "<div class=\"ptab"+(c.id===SEL?" on":"")+"\" data-sel=\""+esc(c.id)+"\">"+esc(c.title)+"</div>";
    }).join("") : "";
    document.getElementById("yearLabel").textContent = YEAR+"년";
  }

  function renderInfoStrip(c){
    var period = (c.start||c.end) ? (fmtYM(c.start)+" ~ "+fmtYM(c.end)) : "-";
    return "<div class=\"info-strip\">"
      +"<span class=\"title\">"+esc(c.title)+"</span>"
      +"<div class=\"info-meta first\"><span class=\"info-lab\">수행기관</span><span class=\"info-val\">"+esc(c.org||"-")+"</span></div>"
      +"<span class=\"info-sep\"></span>"
      +"<div class=\"info-meta\"><span class=\"info-lab\">책임자</span><span class=\"info-val\">"+esc(c.pi||"-")+"</span></div>"
      +"<span class=\"info-sep\"></span>"
      +"<div class=\"info-meta\"><span class=\"info-lab\">기간</span><span class=\"info-val\">"+period+"</span></div>"
      +"<span class=\"info-sep\"></span>"
      +"<div class=\"info-meta\"><span class=\"info-lab\">위탁금액</span><span class=\"info-val\">"+esc(c.budget||"-")+"</span></div>"
      +"</div>";
  }



  function meetMatches(m){
    if(MFILTER.type!=="전체" && m.kind!==MFILTER.type) return false;
    if(MFILTER.status!=="전체" && m.status!==MFILTER.status) return false;
    var q=(MFILTER.search||"").trim().toLowerCase();
    if(q){ var hay=[m.title,m.attendees,m.body].join(" ").toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  }
  function renderMeetings(){
    var all=meetingsOf(SEL).sort(function(a,b){return (a.date<b.date)?1:-1;});
    var list=all.filter(meetMatches);
    var rows=list.length ? list.map(function(m,i){
      return "<tr data-id=\""+esc(m.id)+"\">"
        +"<td>"+(i+1)+"</td>"
        +"<td>"+kindBadge(m.kind)+"</td>"
        +"<td>"+mstatBadge(m.status)+"</td>"
        +"<td>"+modeBadge(m.mode)+"</td>"
        +"<td>"+fmtMDW(m.date)+"</td>"
        +"<td style=\"font-weight:600;color:var(--navy)\">"+esc(m.title)+"</td>"
        +"<td>"+esc(m.attendees||"-")+"</td>"
        +"</tr>";
    }).join("") : "<tr class=\"empty-row\"><td colspan=\"7\">"+(all.length?"검색·필터 조건에 맞는 회의가 없습니다.":"등록된 회의가 없습니다.")+"</td></tr>";
    return "<div class=\"sec-h\"><span class=\"sub\">월간회의·실무진회의·보고 · 총 "+all.length+"건</span>"
      +"<button class=\"addbtn\" id=\"addMeetBtn\">+ 회의 추가</button></div>"
      +"<div class=\"filterbar\">"
        +"<input type=\"text\" id=\"mSearch\" placeholder=\"제목·참석자·안건 검색\" style=\"flex:1;max-width:230px;border:1px solid var(--line-2);border-radius:6px;padding:8px 11px;font-size:12.5px\" value=\""+esc(MFILTER.search)+"\">"
        +"<select id=\"mType\"></select><select id=\"mStatus\"></select>"
        +"<span class=\"cnt\">조회 <b>"+list.length+"</b>건</span>"
        +"<button class=\"reset\" id=\"mReset\">초기화</button>"
      +"</div>"
      +"<table class=\"tbl cm\"><thead><tr><th>No</th><th>구분</th><th>상태</th><th>형태</th><th>일시</th><th>주요 안건</th><th>참석</th></tr></thead>"
      +"<tbody>"+rows+"</tbody></table>";
  }

  function render(){
    buildTabs();
    var c=curConsignment();
    var html;
    if(DATA.error){
      html="<div class=\"empty-note\">"+esc(DATA.errorSrc||"위탁과제")+" 데이터를 불러오지 못했습니다.<br><br>"
        +"<span style=\"font-size:11px;color:var(--muted)\">"+esc(DATA.error)+"</span><br><br>"
        +"<span style=\"font-size:11.5px\">노션에서 '"+esc(DATA.errorSrc||"위탁과제")+"' DB가 연동 인테그레이션(AI-team-dashboard-KOTI)에 연결돼 있는지 확인해 주세요.</span></div>";
    } else if(!DATA.consignments.length){
      html="<div class=\"empty-note\">등록된 위탁과제가 없습니다. 노션 '위탁과제 정보' DB에 과제를 추가해 주세요.</div>";
    } else if(!c){
      html="<div class=\"empty-note\">"+YEAR+"년에 해당하는 위탁과제가 없습니다.</div>";
    } else {
      html = renderInfoStrip(c) + renderMeetings();
    }
    document.getElementById("content").innerHTML = html;
    if(c && !DATA.error){ fillDynamicFilters(); }
  }
  function fillDynamicFilters(){
    function opt(arr,all,cur){ return "<option value=\"전체\""+(cur==="전체"?" selected":"")+">"+all+"</option>"+arr.map(function(x){return "<option value=\""+esc(x)+"\""+(x===cur?" selected":"")+">"+esc(x)+"</option>";}).join(""); }
    document.getElementById("mType").innerHTML=opt(KIND_LIST,"종류 전체",MFILTER.type);
    document.getElementById("mStatus").innerHTML=opt(["예정","완료"],"상태 전체",MFILTER.status);
  }

  // ===== 탭/필터 이벤트 (동적 요소이므로 문서 위임) =====
  document.getElementById("ptabs").addEventListener("click", function(e){
    var t=e.target.closest("[data-sel]"); if(!t) return;
    SEL=t.dataset.sel; render();
  });
  document.getElementById("yearPrev").addEventListener("click", function(){ YEAR--; var avail=DATA.consignments.filter(function(c){return inYear(c,YEAR);}); SEL=avail.length?avail[0].id:null; render(); });
  document.getElementById("yearNext").addEventListener("click", function(){ YEAR++; var avail=DATA.consignments.filter(function(c){return inYear(c,YEAR);}); SEL=avail.length?avail[0].id:null; render(); });
  document.getElementById("refreshBtn").addEventListener("click", load);

  document.getElementById("content").addEventListener("click", function(e){
    var addM=e.target.closest("#addMeetBtn");
    if(addM){ openMeetAdd(); return; }
    var mReset=e.target.closest("#mReset");
    if(mReset){ MFILTER={search:"",type:"전체",status:"전체"}; render(); return; }
    var mRow=e.target.closest("tr[data-id]");
    if(mRow){ openMeetView(mRow.dataset.id); return; }
  });
  document.getElementById("content").addEventListener("change", function(e){
    if(e.target.id==="mType"){ MFILTER.type=e.target.value; render(); }
    if(e.target.id==="mStatus"){ MFILTER.status=e.target.value; render(); }
  });
  document.getElementById("content").addEventListener("input", function(e){
    if(e.target.id==="mSearch"){ MFILTER.search=e.target.value; render(); document.getElementById("mSearch").focus(); document.getElementById("mSearch").selectionStart=document.getElementById("mSearch").value.length; }
  });

  // ===== 회의록 모달 =====
  function findMeet(id){ return DATA.meetings.filter(function(m){return m.id===id;})[0]; }
  // 위계별 들여쓰기(2/4칸 공백)를 줄마다 별도 div의 padding으로 옮겨서, 줄바꿈(wrap)되는 긴 문장도
  // 들여쓰기 위치가 흐트러지지 않고 정렬 유지되게 함 (leading space만으로는 wrap된 줄이 정렬 안 됨)
  // 위계별 들여쓰기 + 내어쓰기(hanging indent): 줄바꿈된 두 번째 줄부터는 "표식(❑/-/‣)" 위치가 아니라
  // 첫 줄의 실제 글자 시작 위치에 맞춰지게 padding-left + text-indent 조합 사용
  function renderIndentedText(text){
    if(!text || !text.trim()) return "-";
    var HANG = 14; // 표식("❑ "/"- "/"‣ ") 실제 너비에 맞춘 내어쓰기 폭
    return text.split("\n").map(function(ln){
      if(ln.trim()===""){ return "<div style=\"height:8px\"></div>"; }
      var m = ln.match(/^( *)/);
      var level = m[1].length>=4 ? 2 : (m[1].length>=2 ? 1 : 0);
      var base = level*18;
      return "<div style=\"padding-left:"+(base+HANG)+"px;text-indent:-"+HANG+"px\">"+esc(ln.replace(/^ +/,""))+"</div>";
    }).join("");
  }
  function meetSectionBox(label, text){
    return "<div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px;margin-top:14px\">"+label+"</div>"
      +"<div style=\"font-size:14.5px;color:var(--text);background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:14px 16px;line-height:1.8\">"+renderIndentedText(text)+"</div>";
  }
  // 회의 내용: 새 방식(꼭지별 블록 + 꼭지별 이미지)이 있으면 그걸로, 없으면(예전 회의) 속성 하나였던 legacy 텍스트로 표시
  function meetBodySectionsHtml(m){
    if(m.sections && m.sections.length){
      return m.sections.map(function(s){
        var figsHtml = (s.figures||[]).map(function(f){
          var src = WORKER_URL + "?scope=imageProxy&url=" + encodeURIComponent(f.url);
          return "<img src=\""+esc(src)+"\" alt=\""+esc(f.caption||"")+"\" style=\"max-width:100%;border-radius:6px;border:1px solid var(--line-2);margin-top:8px;display:block\">";
        }).join("");
        return "<div style=\"border-bottom:1px solid var(--line-2);padding:10px 2px\">"
          +"<div style=\"font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px\">"+esc(s.heading)+"</div>"
          +"<div style=\"font-size:14px;color:var(--text);line-height:1.8\">"+renderIndentedText(s.body)+"</div>"
          +figsHtml+"</div>";
      }).join("");
    }
    return "<div style=\"font-size:14.5px;color:var(--text);background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:14px 16px;line-height:1.8\">"+renderIndentedText(m.body)+"</div>";
  }

      +"<textarea class=\"agenda-edit\" id=\"mfBody\" placeholder=\"꼭지 제목\n- 세부 내용\n  ‣ 하위 내용\n\n다음 꼭지 제목\n- 세부 내용\">"+esc((m.sections&&m.sections.length)?serializeConsignSections(m.sections):(m.body||""))+"</textarea>"
      +"<div class=\"estatus status\" id=\"mfStatusMsg\"></div>";
  }
  // ===== 회의록 PDF 자동 파싱 (weekly-meeting.html과 동일한 방식: pdf.js로 클라이언트에서 직접 처리, 무료) =====
  // 실제 회의록 양식 문자 확인 결과: 위계1 "❑"(U+2751, □ 아님) / 위계2 "-" / 위계3 "‣"(U+2023)
  if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
  async function consignPdfExtractLines(file){
    if(!window.pdfjsLib) throw new Error("PDF 라이브러리 로딩 중입니다. 잠시 후 다시 시도하세요.");
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var lines = [];
    for(var i=1;i<=pdf.numPages;i++){
      var page = await pdf.getPage(i);
      var content = await page.getTextContent();
      var items = content.items, curY=null, curLine="";
      items.forEach(function(it){
        var y=Math.round(it.transform[5]);
        if(curY===null){ curY=y; curLine=it.str; }
        else if(Math.abs(y-curY)<=3){ curLine+=it.str; }
        else { lines.push(curLine); curLine=it.str; curY=y; }
      });
      if(curLine) lines.push(curLine);
    }
    return lines.filter(function(ln){ var t=ln.trim();
      if(t==="") return false;
      if(/^-\s*\d+\s*-$/.test(t)) return false; // 페이지 번호
      if(/^회\s*의\s*내\s*용$/.test(t)) return false; // 표 왼쪽 행 라벨(병합 셀 중간에 끼어들어옴)
      return true; });
  }
  function classifyConsignLevel(line){
    if(/^❑/.test(line)) return 1;
    if(/^-/.test(line)) return 2;
    if(/^‣/.test(line)) return 3;
    return 0;
  }
  // ❑(위계1)마다 새 그룹, -/‣ 는 하위로 들여쓰기(각 2/4칸). 하위 항목이 있으면 ❑ 그룹 사이에 빈 줄 삽입.
  // 기호 없는 줄(PDF 줄바꿈으로 잘린 문장)은 직전 항목에 이어붙임. (회의주제/결정사항/향후논의사항처럼 짧은 영역용)
  function formatConsignBody(lines){
    var groups=[], cur=null;
    lines.forEach(function(line){
      var lvl=classifyConsignLevel(line);
      if(lvl===1){ cur={text:line, children:[]}; groups.push(cur); }
      else if(lvl===2||lvl===3){
        if(!cur){ cur={text:"", children:[]}; groups.push(cur); }
        cur.children.push({level:lvl, text:line});
      } else if(cur){
        if(cur.children.length) cur.children[cur.children.length-1].text += " "+line;
        else cur.text += " "+line;
      }
    });
    var hasDeep = groups.some(function(g){ return g.children.length>0; });
    var out=[];
    groups.forEach(function(g,i){
      if(i>0 && hasDeep) out.push("");
      out.push(g.text);
      g.children.forEach(function(c){ out.push((c.level===2?"  ":"    ")+c.text); });
    });
    return out.join("\n");
  }
  // "회의 내용" 전용: ❑ 하나가 이미 별도 꼭지(heading)로 분리되므로, 그 안에서는 -(위계2)가 최상위, ‣(위계3)이 하위
  function formatConsignSectionBody(lines){
    var groups=[], cur=null;
    lines.forEach(function(line){
      var lvl=classifyConsignLevel(line);
      if(lvl===2){ cur={text:line, children:[]}; groups.push(cur); }
      else if(lvl===3){
        if(!cur){ cur={text:"", children:[]}; groups.push(cur); }
        cur.children.push({level:lvl, text:line});
      } else if(cur){
        if(cur.children.length) cur.children[cur.children.length-1].text += " "+line;
        else cur.text += " "+line;
      } else {
        cur = { text: line, children: [] }; groups.push(cur);
      }
    });
    var hasDeep = groups.some(function(g){ return g.children.length>0; });
    var out=[];
    groups.forEach(function(g,i){
      if(i>0 && hasDeep) out.push("");
      out.push(g.text);
      g.children.forEach(function(c){ out.push("  "+c.text); });
    });
    return out.join("\n");
  }
  // "회의 내용" 블록을 ❑ 단위로 꼭지(heading) 분리 — 주간회의의 sections와 동일한 개념
  function splitConsignSections(lines){
    var sections=[], curHeading=null, curLines=[];
    lines.forEach(function(line){
      if(classifyConsignLevel(line)===1){
        if(curHeading!==null) sections.push({ heading: curHeading, body: formatConsignSectionBody(curLines) });
        curHeading = line.replace(/^❑\s*/, "").trim();
        curLines = [];
      } else if(curHeading!==null){
        curLines.push(line);
      }
    });
    if(curHeading!==null) sections.push({ heading: curHeading, body: formatConsignSectionBody(curLines) });
    return sections;
  }
  // "회의 내용" 편집칸 ↔ sections 배열 변환. 경계는 "이 줄이 -/‣로 시작하는가"로 판단
  // (본문 안의 가독성용 빈 줄과 꼭지 경계가 절대 안 헷갈림 — weekly-meeting과 동일한 원리)
  function serializeConsignSections(sections){
    return (sections||[]).map(function(s){ return s.heading+"\n"+(s.body||""); }).join("\n\n");
  }
  function parseConsignSectionsText(text){
    var lines = (text||"").split("\n");
    var items=[], cur=null;
    lines.forEach(function(raw){
      var trimmed = raw.trim();
      if(trimmed===""){ if(cur) cur.bodyLines.push(""); return; }
      var isBullet = classifyConsignLevel(trimmed) >= 2;
      if(!isBullet){ cur = { heading: trimmed, bodyLines: [] }; items.push(cur); }
      else if(cur){ cur.bodyLines.push(raw); }
    });
    return items.map(function(it){
      return { heading: it.heading, body: it.bodyLines.join("\n").replace(/\n+$/,"").replace(/^\n+/,"") };
    }).filter(function(s){ return s.heading; });
  }
  function todayKST(){
    var kst = new Date(Date.now() + 9*60*60*1000);
    function z(n){ return (n<10?"0":"")+n; }
    return kst.getUTCFullYear()+"-"+z(kst.getUTCMonth()+1)+"-"+z(kst.getUTCDate());
  }
  // "기관 이름 직위" 순서 고정 형식에서 이름만 추출 (예: "한양대학교 박준영 교수" → "박준영")
  // "OO 외 N명" 같은 꼬리는 이름 옆에 그대로 붙여서 유지 (예: "이숭봉 부연구위원 외 7명" → "이숭봉 외 7명")
  function extractAttendeeNames(raw){
    if(!raw) return "";
    var segs = raw.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    var names = segs.map(function(seg){
      var tailMatch = seg.match(/(외\s*\d+\s*명)\s*$/);
      var tail = tailMatch ? (" "+tailMatch[1]) : "";
      var core = tailMatch ? seg.slice(0, tailMatch.index).trim() : seg;
      var words = core.split(/\s+/).filter(Boolean);
      var name = words.length >= 2 ? words[words.length-2] : (words[0] || "");
      return name ? (name+tail) : "";
    }).filter(Boolean);
    return names.join(", ");
  }
  function parseConsignMeetingPdfLines(allLines){
    var fullText = allLines.join("\n");
    var titleMatch = fullText.match(/회\s*의\s*명\s*([^\n]+)/);
    var title = titleMatch ? titleMatch[1].trim() : "";

    // 표 레이아웃이라 pdf.js가 라벨/값 순서를 완벽히 보장 못 할 수 있어서,
    // "일시" 라벨에 의존하지 않고 헤더 영역(첫 '[' 이전) 전체에서 날짜 패턴 자체를 바로 찾음
    var headerText = fullText.split("[")[0];
    var dateMatch = headerText.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
    var date = dateMatch ? (dateMatch[1]+"-"+("0"+dateMatch[2]).slice(-2)+"-"+("0"+dateMatch[3]).slice(-2)) : "";

    var locMatch = headerText.match(/장\s*소\s*([^\n]+)/);
    var location = locMatch ? locMatch[1].trim() : "";
    var mode = /화상/.test(location) ? "화상" : "대면";

    var status = date ? (date < todayKST() ? "완료" : "예정") : "예정";

    var attendeesRaw = "";
    // 라벨 바로 위/아래 한 줄씩만 보는 대신, "장소가 있는 줄" ~ "회의목적 줄" 사이 모든 줄을 통째로 모음
    // (pdf.js가 참석자 목록을 몇 줄로 쪼개든 안전하게 다 잡힘)
    var locLineIdx = allLines.findIndex(function(l){ return /장\s*소/.test(l); });
    var purposeLineIdx = allLines.findIndex(function(l){ return /^회\s*의\s*목\s*적/.test(l.trim()); });
    if(locLineIdx>=0 && purposeLineIdx>locLineIdx){
      var attLines = [];
      for(var k=locLineIdx+1; k<purposeLineIdx; k++){
        var t = allLines[k].trim();
        if(/^참\s*석\s*자$/.test(t)) continue; // 라벨 단독 줄이면 건너뜀
        attLines.push(allLines[k]);
      }
      attendeesRaw = attLines.join(" ").replace(/참\s*석\s*자/, "").trim();
    }
    if(!attendeesRaw){
      var attInline = headerText.match(/참\s*석\s*자\s*([^\n]+)/);
      if(attInline) attendeesRaw = attInline[1].trim();
    }
    var attendees = extractAttendeeNames(attendeesRaw);

    function extractBracket(name){
      var re = new RegExp("\\["+name+"\\]([\\s\\S]*?)(?=\\[|$)");
      var m = fullText.match(re);
      return m ? m[1] : "";
    }
    function linesOf(raw){ return raw.split("\n").map(function(l){return l.trim();}).filter(Boolean); }

    return {
      title: title, date: date, mode: mode, status: status, attendees: attendees,
      topic: formatConsignBody(linesOf(extractBracket("회의\\s*주제"))),
      decision: formatConsignBody(linesOf(extractBracket("결정\\s*사항"))),
      followup: formatConsignBody(linesOf(extractBracket("향후\\s*논의사항"))),
      bodySections: splitConsignSections(linesOf(extractBracket("회의\\s*내용")))
    };
  }
  if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
  // 이미지가 포함된 페이지 탐지(무료) — 대부분의 표/그림은 이미지로 삽입되므로 이걸로 걸러짐
  async function detectConsignFigurePages(pdf){
    var figures = [];
    for(var i=1;i<=pdf.numPages;i++){
      var page = await pdf.getPage(i);
      var ops = await page.getOperatorList();
      var hasImage = ops.fnArray.indexOf(pdfjsLib.OPS.paintImageXObject) >= 0
        || ops.fnArray.indexOf(pdfjsLib.OPS.paintJpegXObject) >= 0;
      if(hasImage) figures.push({ page: i, hint: "이미지 포함 페이지" });
    }
    return figures;
  }
  // 표/그림이 있는 페이지를 실제로 렌더링해서 보여주고, 사용자가 드래그로 크롭 영역을 잡아 pendingConsignImages에 담게 함
  // (weekly-meeting과 동일한 반자동 방식 — 회의록은 아젠다 앵커가 없어서 "연결할 항목" 선택 없이 그냥 담기만 함)
  async function renderConsignFigureCropUI(file, figures, sections){
    var area = document.getElementById("mfFiguresCropArea");
    area.innerHTML = "";
    if(!figures || !figures.length){ area.style.display = "none"; return; }
    area.style.display = "block";
    if(!window.pdfjsLib){
      area.innerHTML = '<div class="edit-hint">미리보기 라이브러리 로드 실패 — 저장 후 상세 화면에서 직접 이미지를 첨부해 주세요.</div>';
      return;
    }
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var headingOpts = (sections||[]).map(function(s){ return s.heading; }).filter(Boolean);

    figures.forEach(function(fig, idx){
      var block = document.createElement("div"); block.className = "crop-block";
      block.innerHTML =
        '<div class="edit-hint" style="margin-bottom:6px">'+fig.page+'쪽 — '+esc(fig.hint||"표/그림")+' (드래그로 영역 선택)</div>'+
        '<div class="crop-canvas-wrap" id="ccropWrap'+idx+'"></div>'+
        '<div class="crop-tools">'+
          '<span>연결할 꼭지:</span>'+
          '<select id="ccropSec'+idx+'"><option value="">(연결 안 함 · 맨 끝에 첨부)</option>'+
            headingOpts.map(function(h){ return '<option value="'+esc(h)+'">'+esc(h)+'</option>'; }).join("")+
          '</select>'+
          '<button type="button" class="mbtn ghost" id="ccropBtn'+idx+'">이 영역 크롭해서 담기</button>'+
          '<span class="crop-status" id="ccropStatus'+idx+'"></span>'+
        '</div>';
      area.appendChild(block);

      pdf.getPage(fig.page).then(function(page){
        var viewport = page.getViewport({ scale: 1.3 });
        var canvas = document.createElement("canvas");
        canvas.width = viewport.width; canvas.height = viewport.height;
        var wrap = document.getElementById("ccropWrap"+idx);
        wrap.style.position = "relative";
        wrap.appendChild(canvas);
        page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport });

        var selBox = null, startX = 0, startY = 0, curRect = null;
        wrap.addEventListener("mousedown", function(e){
          var r = canvas.getBoundingClientRect();
          startX = e.clientX - r.left; startY = e.clientY - r.top;
          if(selBox) selBox.remove();
          selBox = document.createElement("div"); selBox.className = "crop-sel";
          wrap.appendChild(selBox); curRect = null;
          function onMove(ev){
            var x = ev.clientX - r.left, y = ev.clientY - r.top;
            var left = Math.min(x,startX), top = Math.min(y,startY);
            var w = Math.abs(x-startX), h = Math.abs(y-startY);
            selBox.style.left=left+"px"; selBox.style.top=top+"px";
            selBox.style.width=w+"px"; selBox.style.height=h+"px";
            curRect = { left:left, top:top, w:w, h:h };
          }
          function onUp(){ document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); }
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });

        document.getElementById("ccropBtn"+idx).addEventListener("click", function(){
          var cst = document.getElementById("ccropStatus"+idx);
          if(!curRect || curRect.w<5 || curRect.h<5){ cst.textContent = "먼저 영역을 드래그로 선택하세요"; return; }
          var scaleX = canvas.width / canvas.clientWidth, scaleY = canvas.height / canvas.clientHeight;
          var out = document.createElement("canvas");
          out.width = Math.round(curRect.w*scaleX); out.height = Math.round(curRect.h*scaleY);
          out.getContext("2d").drawImage(canvas,
            Math.round(curRect.left*scaleX), Math.round(curRect.top*scaleY), out.width, out.height,
            0, 0, out.width, out.height);
          pendingConsignImages.push({ sectionHeading: document.getElementById("ccropSec"+idx).value, dataUrl: out.toDataURL("image/png"), filename: "figure_p"+fig.page+".png" });
          cst.textContent = "✓ 담김 (현재 "+pendingConsignImages.length+"개)";
        });
      });
    });
  }
  document.getElementById("meetBody").addEventListener("change", async function(e){
    if(e.target.id!=="mfPdfInput") return;
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var pst = document.getElementById("mfPdfStatus");
    pst.className = "estatus status show info"; pst.textContent = "PDF 분석 중…";
    pendingConsignImages = [];
    try {
      var buf0 = await file.arrayBuffer();
      var pdfForFigs = await pdfjsLib.getDocument({ data: buf0 }).promise;
      var lines = await consignPdfExtractLines(file);
      var r = parseConsignMeetingPdfLines(lines);
      var figures = await detectConsignFigurePages(pdfForFigs);
      if(r.title) document.getElementById("mfTitle").value = r.title;
      if(r.date) document.getElementById("mfDate").value = r.date;
      if(r.mode) document.getElementById("mfMode").value = r.mode;
      if(r.status) document.getElementById("mfStatus").value = r.status;
      if(r.attendees) document.getElementById("mfAttendees").value = r.attendees;
      if(r.topic) document.getElementById("mfTopic").value = r.topic;
      if(r.decision) document.getElementById("mfDecision").value = r.decision;
      if(r.followup) document.getElementById("mfFollowup").value = r.followup;
      if(r.bodySections && r.bodySections.length) document.getElementById("mfBody").value = serializeConsignSections(r.bodySections);
      var fh = document.getElementById("mfFiguresHint");
      if(figures.length){
        fh.style.display = "block";
        fh.textContent = "이미지가 포함된 페이지 " + figures.length + "곳을 아래에서 직접 크롭해 담아 주세요.";
      } else { fh.style.display="none"; fh.textContent=""; }
      await renderConsignFigureCropUI(file, figures, r.bodySections);
      pst.className = "estatus status show ok"; pst.textContent = "자동 채움 완료(무료·로컬 처리) — 내용 확인 후 저장하세요";
    } catch(err){
      pst.className = "estatus status show err"; pst.textContent = "분석 실패: " + err.message;
    }
  });

  function openMeetView(id){
    var m=findMeet(id); if(!m) return;
    MEDIT={id:id, mode:"view"};
    document.getElementById("meetHead").textContent="회의 상세";
    document.getElementById("meetBody").innerHTML=meetViewHtml(m);
    document.getElementById("meetFoot").innerHTML="<button class=\"mbtn danger\" id=\"meetDelBtn\">삭제</button><div style=\"flex:1\"></div>"
      +"<button class=\"mbtn ghost\" id=\"meetCloseBtn\">닫기</button><button class=\"mbtn primary\" id=\"meetEditBtn\">수정</button>";
    document.getElementById("meetOv").classList.add("open");
  }
  function openMeetAdd(){
    var blank={kind:"월간회의",status:"예정",mode:"대면",date:"",title:"",attendees:"",topic:"",decision:"",followup:"",body:""};
    MEDIT={id:null, mode:"edit"};
    pendingConsignImages=[];
    document.getElementById("meetHead").textContent="회의 추가";
    document.getElementById("meetBody").innerHTML=meetEditHtml(blank);
    document.getElementById("meetFoot").innerHTML="<div style=\"flex:1\"></div><button class=\"mbtn ghost\" id=\"meetCancelBtn\">취소</button><button class=\"mbtn primary\" id=\"meetSaveBtn\">저장</button>";
    document.getElementById("meetOv").classList.add("open");
  }
  function switchMeetToEdit(){
    var m=findMeet(MEDIT.id); if(!m) return;
    MEDIT.mode="edit";
    pendingConsignImages=[];
    document.getElementById("meetHead").textContent="회의 수정";
    document.getElementById("meetBody").innerHTML=meetEditHtml(m);
    document.getElementById("meetFoot").innerHTML="<button class=\"mbtn danger\" id=\"meetDelBtn\">삭제</button><div style=\"flex:1\"></div>"
      +"<button class=\"mbtn ghost\" id=\"meetCancelBtn\">취소</button><button class=\"mbtn primary\" id=\"meetSaveBtn\">저장</button>";
  }
  function closeMeet(){ document.getElementById("meetOv").classList.remove("open"); }
  document.getElementById("meetX").addEventListener("click", closeMeet);
  document.getElementById("meetOv").addEventListener("click", function(e){ if(e.target.id==="meetOv") closeMeet(); });
  document.getElementById("meetFoot").addEventListener("click", async function(e){
    if(e.target.id==="meetCloseBtn"||e.target.id==="meetCancelBtn"){ closeMeet(); return; }
    if(e.target.id==="meetEditBtn"){ switchMeetToEdit(); return; }
    if(e.target.id==="meetDelBtn"){
      if(!confirm("이 회의를 삭제하시겠어요?")) return;
      try {
        var res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"consignMeetingDelete",id:MEDIT.id})});
        var data=await res.json(); if(!data.ok) throw new Error(data.error||"실패");
        closeMeet(); load();
      } catch(err){ alert("삭제 실패: "+err.message); }
      return;
    }
    if(e.target.id==="meetSaveBtn"){
      var title=document.getElementById("mfTitle").value.trim();
      var st=document.getElementById("mfStatusMsg");
      if(!title){ st.className="estatus status show err"; st.textContent="주요 안건을 입력하세요."; return; }
      var sections = parseConsignSectionsText(document.getElementById("mfBody").value);
      var item={
        id:MEDIT.id, project:SEL, kind:document.getElementById("mfType").value, status:document.getElementById("mfStatus").value,
        mode:document.getElementById("mfMode").value, date:document.getElementById("mfDate").value, title:title,
        attendees:document.getElementById("mfAttendees").value.trim(),
        topic:document.getElementById("mfTopic").value.trim(),
        decision:document.getElementById("mfDecision").value.trim(),
        followup:document.getElementById("mfFollowup").value.trim(),
        sections:sections
      };
      st.className="estatus status show info"; st.textContent="저장 중…";
      try {
        var action=MEDIT.id?"consignMeetingUpdate":"consignMeetingCreate";
        var res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:action,item:item})});
        var data=await res.json(); if(!data.ok) throw new Error(data.error||"실패");
        var meetingId = MEDIT.id || (data.result && data.result.id);
        if(meetingId && pendingConsignImages.length){
          st.textContent = "이미지 첨부 중…";
          var imgOk=0, imgFail=0, lastErr="";
          for(var i=0;i<pendingConsignImages.length;i++){
            var pi = pendingConsignImages[i];
            var idx = sections.findIndex(function(s){ return s.heading === pi.sectionHeading; });
            try {
              var ires=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
                action:"consignMeetingAddImage", meetingId:meetingId,
                sectionIndex: idx>=0 ? idx : null,
                imageBase64: pi.dataUrl.split(",")[1], filename: pi.filename, mimeType:"image/png"
              })});
              var idata=await ires.json();
              if(idata.ok) imgOk++; else { imgFail++; lastErr = idata.error||"알 수 없는 오류"; }
            } catch(e){ imgFail++; lastErr = String(e); }
          }
          if(imgFail){
            st.className="estatus status show err";
            st.textContent="회의록은 저장됐지만 이미지 "+imgFail+"개 첨부 실패("+imgOk+"개 성공): "+lastErr;
            setTimeout(function(){ closeMeet(); load(); }, 1800);
            return;
          }
        }
        st.className="estatus status show ok"; st.textContent="저장 완료";
        setTimeout(function(){ closeMeet(); load(); }, 500);
      } catch(err){ st.className="estatus status show err"; st.textContent="저장 실패: "+err.message; }
    }
  });

  // 테마
  (function(){
    var root=document.documentElement, btn=document.getElementById("themeBtn");
    function set(t){ root.setAttribute("data-theme",t); btn.textContent=(t==="dark"?"☀️ 라이트모드":"🌙 다크모드"); }
    btn.addEventListener("click", function(){ set(root.getAttribute("data-theme")==="dark"?"light":"dark"); });
  })();

  load();

  // 1시간 자동 새로고침 (편집 모달이 열려 있으면 건너뜀 - 작성 중인 내용 보호)
  setInterval(function(){
    if(document.querySelector(".ov.open")) return;
    var ae=document.activeElement;
    if(ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.tagName==="SELECT")) return;
    load();
  }, 3600000);
</script>
