<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="KOTI 연구팀 — Claude Code Multi-Agent Research Team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a23"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2f6df6"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Roboto,Helvetica,Arial,sans-serif; }
      .mono { font-family: "SF Mono",ui-monospace,"Cascadia Code","Consolas",Menlo,monospace; }
    </style>
  </defs>

  <!-- explicit background so it renders identically on dark and light GitHub -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none" stroke="#262c39" stroke-width="1"/>

  <!-- accent rail -->
  <rect x="0" y="0" width="8" height="300" rx="4" fill="url(#accent)"/>

  <!-- left mark: hub-and-spokes glyph (orchestrator -> agents) -->
  <g transform="translate(108,150)">
    <circle cx="0" cy="0" r="74" fill="none" stroke="#2b3340" stroke-width="1.5"/>
    <!-- spokes -->
    <g stroke="#3a4456" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="-58"/>
      <line x1="0" y1="0" x2="50" y2="-29"/>
      <line x1="0" y1="0" x2="50" y2="29"/>
      <line x1="0" y1="0" x2="0" y2="58"/>
      <line x1="0" y1="0" x2="-50" y2="29"/>
      <line x1="0" y1="0" x2="-50" y2="-29"/>
    </g>
    <!-- agent nodes -->
    <g fill="#8b97ab">
      <circle cx="0" cy="-58" r="9"/>
      <circle cx="50" cy="-29" r="9"/>
      <circle cx="50" cy="29" r="9"/>
      <circle cx="0" cy="58" r="9"/>
      <circle cx="-50" cy="29" r="9"/>
      <circle cx="-50" cy="-29" r="9"/>
    </g>
    <!-- orchestrator core -->
    <circle cx="0" cy="0" r="20" fill="url(#accent)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#10131a" stroke-width="3"/>
  </g>

  <!-- title block -->
  <g transform="translate(232,0)">
    <text x="0" y="118" class="sans" font-size="58" font-weight="700" fill="#f3f5f9">KOTI 연구팀</text>
    <text x="4" y="158" class="mono" font-size="21" font-weight="600" letter-spacing="0.5" fill="#5b9bff">Claude Code Multi-Agent Research Team</text>

    <!-- divider -->
    <rect x="4" y="178" width="760" height="1" fill="#2a3140"/>

    <!-- tagline -->
    <text x="4" y="214" class="sans" font-size="20" fill="#c4ccd9">팀장(서달미)이 오더를 분해해 연구원 6명에게 자동 분배</text>
    <text x="4" y="244" class="sans" font-size="20" fill="#c4ccd9">실시간 메신저로 전 과정을 모니터링</text>

    <!-- pills -->
    <g transform="translate(4,266)">
      <g>
        <rect x="0" y="0" width="138" height="26" rx="13" fill="#1c2230" stroke="#2f3a4d" stroke-width="1"/>
        <circle cx="16" cy="13" r="4" fill="#3b82f6"/>
        <text x="28" y="18" class="sans" font-size="13" fill="#aeb8c8">Orchestrator</text>
      </g>
      <g transform="translate(150,0)">
        <rect x="0" y="0" width="150" height="26" rx="13" fill="#1c2230" stroke="#2f3a4d" stroke-width="1"/>
        <circle cx="16" cy="13" r="4" fill="#22c55e"/>
        <text x="28" y="18" class="sans" font-size="13" fill="#aeb8c8">6 Subagents</text>
      </g>
      <g transform="translate(312,0)">
        <rect x="0" y="0" width="180" height="26" rx="13" fill="#1c2230" stroke="#2f3a4d" stroke-width="1"/>
        <circle cx="16" cy="13" r="4" fill="#f59e0b"/>
        <text x="28" y="18" class="sans" font-size="13" fill="#aeb8c8">Realtime Messenger</text>
      </g>
    </g>
  </g>
</svg>
