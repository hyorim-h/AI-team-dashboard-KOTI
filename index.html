<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 · AI빅데이터연구팀</title>
<style>
  :root{
    --navy:#16265e; --navy-2:#1a2942; --blue:#2c5fbf; --blue-soft:#e8eefb;
    --red:#c8273c; --red-soft:#fdeaec; --green:#1f8a5b; --green-soft:#e3f5ec;
    --orange:#b9770a; --orange-soft:#fff4e0; --purple:#7a4ec2; --purple-soft:#efeafa;
    --bg:#eef1f6; --surface:#ffffff; --line:#dfe5ef; --line-2:#cdd6ec;
    --text:#16265e; --text-2:#5a6680; --muted:#9fb0cf;
    --shadow:0 1px 3px rgba(16,38,94,.06),0 8px 24px rgba(16,38,94,.07);
    --radius:6px; --maxw:1500px;
  }
  html[data-theme="dark"]{
    --navy:#0d1836; --navy-2:#0a1228; --blue:#5b8def; --blue-soft:#16233f;
    --red:#ff7a7a; --red-soft:#3a1717; --green:#43c794; --green-soft:#103024;
    --orange:#e0a94a; --orange-soft:#3a2c17; --purple:#a888e0; --purple-soft:#241a3a;
    --bg:#0a1020; --surface:#111c33; --line:#1e2d4d; --line-2:#26375c;
    --text:#e7eef7; --text-2:#a8b6d4; --muted:#6b7ba0;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo",-apple-system,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 120px}

  .utilbar{background:var(--navy-2);color:#cdd6ec;font-size:12.5px}
  .utilbar .in{max-width:var(--maxw);margin:0 auto;padding:7px 120px;display:flex;justify-content:flex-end;gap:16px;align-items:center}
  .utilbar a{color:#cdd6ec;text-decoration:none}
  .utilbar .sep{color:#3a4a72}
  .util-toggle{background:none;border:none;color:#cdd6ec;cursor:pointer;font-size:12.5px}

  .head{background:var(--surface);border-bottom:1px solid var(--line)}
  .head .in{max-width:var(--maxw);margin:0 auto;padding:16px 120px;display:flex;align-items:center;gap:16px}
  .logo{height:44px}
  .head h1{font-size:20px;font-weight:800;margin:0;color:var(--navy)}
  .head-actions{margin-left:auto;display:flex;gap:10px}
  .hbtn{font-size:13.5px;font-weight:700;padding:9px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--line-2);
    background:var(--surface);color:var(--navy)}
  .hbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .hbtn:hover{filter:brightness(.97)}

  nav.tabs{background:var(--navy)}
  nav.tabs .in{max-width:var(--maxw);margin:0 auto;padding:0 120px;display:flex;gap:2px;flex-wrap:wrap}
  nav.tabs a{color:#b9c8e8;text-decoration:none;font-size:14.5px;font-weight:700;padding:14px 20px;border-bottom:3px solid transparent}
  nav.tabs a:hover{color:#fff}
  nav.tabs a.cur{color:#fff;background:var(--blue);border-bottom-color:#fff}

  .ptitle{padding:26px 0 18px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .ptitle .crumb{font-size:12.5px;color:var(--text-2);font-weight:600}
  .ptitle h2{font-size:26px;font-weight:850;margin:2px 0 0;color:var(--navy)}
  .year-nav{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line-2);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow)}
  .year-nav button{border:none;background:none;color:var(--navy);cursor:pointer;font-size:16px;padding:2px 6px}
  .year-nav .ylabel{font-size:14px;font-weight:800;color:var(--navy);min-width:80px;text-align:center}

  .filterbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .filterbar .flabel{font-size:13px;font-weight:800;color:var(--navy);margin-right:2px}
  .filterbar select{border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:13px;
    background:var(--surface);color:var(--text);font-family:inherit}
  .filterbar .cnt{margin-left:auto;font-size:13px;color:var(--text-2);font-weight:600}
  .filterbar .reset{border:1px solid var(--line-2);background:var(--surface);color:var(--navy);border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}

  /* 요약 카드 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px}
  .kpi .k-lab{font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:8px}
  .kpi .k-val{font-size:28px;font-weight:850;color:var(--navy)}
  .kpi .k-val span{font-size:14px;font-weight:700;color:var(--text-2);margin-left:3px}
  .kpi.ongoing .k-val{color:var(--blue)}
  .kpi.done .k-val{color:var(--green)}
  .kpi.hold .k-val{color:var(--orange)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
  .card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card-h .bar{width:4px;height:18px;background:var(--blue);border-radius:2px}
  .card-h h3{font-size:16px;font-weight:800;margin:0;color:var(--navy)}
  .card-h .sub{font-size:12.5px;color:var(--text-2);font-weight:600}
  .card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .addbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--navy);border-radius:8px;
    padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
  .addbtn:hover{background:var(--blue-soft)}

  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
  .tbl th{text-align:center;font-size:12px;font-weight:800;color:var(--text-2);padding:11px 14px;border-bottom:2px solid var(--line);white-space:nowrap}
  .tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center;overflow:hidden;text-overflow:ellipsis}
  .tbl th:nth-child(1),.tbl td:nth-child(1){width:5%}
  .tbl th:nth-child(2),.tbl td:nth-child(2){width:12%}
  .tbl th:nth-child(3),.tbl td:nth-child(3){width:23%}
  .tbl th:nth-child(4),.tbl td:nth-child(4){width:20%}
  .tbl th:nth-child(5),.tbl td:nth-child(5){width:8%}
  .tbl th:nth-child(6),.tbl td:nth-child(6){width:11%}
  .tbl th:nth-child(7),.tbl td:nth-child(7){width:13%}
  .tbl th:nth-child(8),.tbl td:nth-child(8){width:8%}
  .tbl tbody tr{cursor:pointer;transition:background .12s}
  .tbl tbody tr:hover{background:var(--blue-soft)}
  .tbl .col-no{color:var(--muted);font-weight:700}
  .tbl .t-title{font-weight:700;color:var(--navy);text-align:center}
  .tbl .t-sub{color:var(--text-2)}
  .ptag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:4px;white-space:nowrap}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:4px;white-space:nowrap}
  .empty-row td{text-align:center;color:var(--muted);padding:26px;font-size:13px}

  /* 진행률 바 */
  .prog{display:flex;align-items:center;gap:8px;justify-content:center}
  .prog-bar{flex:1;max-width:90px;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .prog-fill{height:100%;background:var(--blue);border-radius:4px}
  .prog-pct{font-size:12px;font-weight:700;color:var(--text-2);min-width:34px;text-align:right}
  .badge.done{background:var(--green);color:#fff}
  .badge.hold{background:var(--orange);color:#fff}

  .state{padding:48px;text-align:center;color:var(--text-2)}
  /* 모달 */
  .ov{display:none;position:fixed;inset:0;background:rgba(10,20,45,.5);z-index:300;align-items:center;justify-content:center;padding:20px}
  .ov.open{display:flex}
  .modal{background:var(--surface);border-radius:10px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.3);animation:mpop .16s ease}
  @keyframes mpop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .modal-head{background:var(--navy);color:#fff;font-size:16px;font-weight:800;padding:16px 22px;
    display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0}
  .modal-head .x{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .mbtn{font-size:13.5px;font-weight:700;padding:9px 18px;border-radius:7px;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--navy)}
  .mbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .mbtn.danger{background:var(--surface);color:var(--red);border-color:var(--red)}
  .mbtn:hover{filter:brightness(.97)}
  /* 폼 */
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld>span{font-size:12.5px;font-weight:700;color:var(--text-2)}
  .fld>span b{color:var(--red)}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:6px;padding:9px 11px;font-size:13.5px;
    background:var(--surface);color:var(--text);font-family:inherit;resize:vertical}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(44,95,191,.13)}
  .fld-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  /* 체크리스트 */
  .chk-head{display:flex;align-items:center;justify-content:space-between}
  .chk-head .chk-lab{font-size:12.5px;font-weight:700;color:var(--text-2)}
  .chk-head .chk-cnt{font-size:12px;font-weight:700;color:var(--blue)}
  .chk-list{display:flex;flex-direction:column;gap:7px;margin-top:2px}
  .chk-item{display:flex;align-items:center;gap:9px}
  .chk-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex:none}
  .chk-item input[type=text]{flex:1;border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;font-size:13px;
    background:var(--surface);color:var(--text);font-family:inherit}
  .chk-item .chk-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;flex:none}
  .chk-item .chk-del:hover{color:var(--red)}
  .chk-add{border:1px dashed var(--line-2);background:var(--surface);color:var(--blue);border-radius:6px;
    padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:4px}
  .chk-add:hover{background:var(--blue-soft)}
  .estatus{margin:0}
  .status{font-size:13px;padding:9px 13px;border-radius:6px;display:none}
  .status.show{display:block}
  .status.info{background:var(--blue-soft);color:var(--blue)}
  .status.err{background:var(--red-soft);color:var(--red)}
  .status.ok{background:var(--green-soft);color:var(--green)}
  /* 상세 보기 */
  .v-title{font-size:19px;font-weight:850;color:var(--navy);margin-bottom:16px}
  .v-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
  .v-item .v-lab{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:2px}
  .v-item .v-val{font-size:14px;font-weight:600;color:var(--text)}
  .v-full{grid-column:1/3}
  .v-chk{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
  .v-chk .vc-item{font-size:13.5px;display:flex;gap:8px;align-items:center;padding:2px 0}
  .v-chk .vc-item.done{color:var(--muted);text-decoration:line-through}
  footer{padding:30px 0 48px;color:var(--muted);font-size:13px;text-align:center}

  @media(max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
<style>
  /* KPI 스트립 */
  .kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer}
  .kpi-card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
  .kpi-lab{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .kpi-val{font-size:22px;font-weight:800;color:var(--navy)}
  .kpi-unit{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}

  /* 카드 공통 */
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:14px;cursor:default}
  .dcard.click{cursor:pointer}
  .dcard.click:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
  .dcard-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .dcard-h .l{display:flex;align-items:center;gap:8px}
  .dcard-h .bar{width:3px;height:15px;background:var(--navy);border-radius:2px}
  .dcard-h h3{font-size:14.5px;font-weight:700;margin:0;color:var(--navy)}
  .dcard-h .r{font-size:11.5px;font-weight:600;color:var(--muted)}
  .dcard-h .r.click{cursor:pointer}
  .dcard-h .r.click:hover{color:var(--navy);text-decoration:underline}

  /* 과제별 연구진 현황 */
  .team-legend{display:flex;align-items:center;gap:14px}
  .team-legend .lg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
  .team-legend .dot{width:9px;height:9px;border-radius:2px}
  .team-grid{display:grid;grid-template-columns:1fr 1fr 1fr 0.6fr 0.6fr;column-gap:14px;row-gap:0}
  .team-grid .tagbox{text-align:center;padding:7px 6px;border-radius:5px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
  .team-grid .pm-row{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line-2)}
  .team-grid .pi-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .team-grid .pi-chip{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:4px;padding:4px 8px}
  .team-grid .pm-chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--navy);background:var(--blue-soft);border-radius:4px;padding:4px 8px}
  .team-grid .res-wrap{display:flex;flex-wrap:wrap;gap:6px}
  .team-grid .res-chip{font-size:11.5px;font-weight:600;color:var(--text);background:var(--bg);border-radius:4px;padding:4px 8px}
  .team-grid .mtg-list{display:flex;flex-direction:column;gap:8px;min-width:0}
  .team-grid .mtg-item{display:flex;flex-direction:column;gap:2px}
  .team-grid .mtg-item.click{cursor:pointer;border-radius:5px;margin:-4px -6px;padding:4px 6px}
  .team-grid .mtg-item.click:hover{background:var(--blue-soft)}
  .team-grid .mtg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
  .team-grid .mtg-l{display:flex;align-items:flex-start;gap:4px;min-width:0;flex-wrap:wrap}
  .team-grid .mtg-review{flex-shrink:0;font-size:9.5px;font-weight:700;color:#c8273c;background:#fbe7ea;border-radius:8px;padding:2px 6px;white-space:nowrap;margin-top:1px}
  .team-grid .mtg-sum{font-size:11.5px;font-weight:600;color:var(--text);white-space:normal;word-break:break-word;line-height:1.45}
  .team-grid .mtg-stat{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
  .team-grid .mtg-date{font-size:10.5px;font-weight:500;color:var(--muted)}
  .team-grid .mtg-empty{font-size:11px;font-weight:500;color:var(--muted)}
  .team-grid .sch-list{display:flex;flex-direction:column;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
  .team-grid .sch-item{display:flex;align-items:baseline;gap:6px;font-size:11px;font-weight:500}
  .team-grid .sch-item .d{color:var(--muted);flex-shrink:0}
  .team-grid .sch-item .l{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team-grid .sch-empty{font-size:11px;color:var(--muted)}

  /* 위젯 2열 그리드 */
  .widget-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}

  /* 이번 주 업무 */
  .wk-split{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .wk-col{}
  .wk-col.left{border-right:1px solid var(--line-2);padding-right:24px}
  .wk-sub{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .wk-row{display:flex;align-items:center;gap:8px;padding:4px 0}
  .wk-row .t{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk-empty{font-size:12px;color:var(--muted);padding:6px 0}

  /* 이번 주 회의 */
  .mt-row{display:flex;align-items:center;gap:7px;padding:5px 0}
  .mt-row .t{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt-row .d{flex-shrink:0;font-size:11.5px;font-weight:500;color:var(--muted);width:66px;text-align:right}

  /* 도넛 위젯(성과/WBS) */
  .donut-row{display:flex;align-items:stretch;justify-content:center;flex-wrap:wrap}
  .donut-sep{width:1px;background:var(--line-2);margin:0 12px}
  .donut-unit{text-align:center}
  .donut-unit .short{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .donut-pair{display:flex;gap:14px;justify-content:center}
  .donut{position:relative;width:82px;height:82px}
  .donut.big{width:98px;height:98px}
  .donut-fill{width:100%;height:100%;border-radius:50%}
  .donut-hole{position:absolute;inset:10px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--navy)}
  .donut.big .donut-hole{inset:11px;font-size:19px}
  .donut-lab{margin-top:5px;font-size:10.5px;font-weight:600;color:var(--muted)}

  /* 위탁과제 카드 */
  .consign-item{border:1px solid var(--line-2);border-radius:5px;padding:10px 12px;cursor:pointer;margin-bottom:11px}
  .consign-item:last-child{margin-bottom:0}
  .consign-item:hover{border-color:var(--navy);background:var(--blue-soft)}
  .consign-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
  .consign-top .t{font-size:12.5px;font-weight:700;color:var(--navy)}
  .consign-top .b{font-size:11px;font-weight:600;color:var(--muted)}
  .consign-sub{font-size:11.5px;color:var(--soft,var(--text-2));line-height:1.4}

  /* 미니 캘린더 */
  .cal-grid{display:grid;grid-template-columns:184px repeat(5,1fr);gap:18px;align-items:stretch}
  .cal-side-col{border-left:1px solid var(--line-2);padding-left:18px;min-width:0}
  .cal-col-lab{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .cal-col-body{font-size:12px;font-weight:500;color:var(--text);line-height:1.4}
  .cal-col-ev{font-size:11.5px;color:var(--text);margin-bottom:8px;line-height:1.5}
  .cal-col-ev:last-child{margin-bottom:0}
  .cal-col-ev .nm{font-weight:700;color:var(--navy);display:block}
  .cal-col-ev .sub{font-weight:500;color:var(--muted);display:block;font-size:11px}
  .cal-col-empty{color:var(--muted)}
  @media(max-width:1300px){ .cal-grid{grid-template-columns:184px repeat(3,1fr);row-gap:16px} }
  .minical-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
  .minical-dow div{text-align:center;font-size:9.5px;font-weight:700;color:var(--muted)}
  .minical-days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px}
  .minical-days .cell{text-align:center;cursor:pointer}
  .minical-days .num{font-size:10.5px;font-weight:500;line-height:19px;color:var(--text)}
  .minical-days .num.today{display:flex;align-items:center;justify-content:center;width:19px;height:19px;margin:0 auto;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:10.5px;line-height:1}
  .minical-days .num.sel{display:flex;align-items:center;justify-content:center;width:19px;height:19px;margin:0 auto;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:10.5px;line-height:1}
  .minical-days .dot{width:3px;height:3px;border-radius:50%;background:var(--blue);margin:2px auto 0}
  .minical-days .dot.none{background:transparent}

  .minical-none{font-size:11.5px;color:var(--muted)}

  @media(max-width:1100px){ .widget-grid{grid-template-columns:1fr} }
</style>
</head>

</div>

<footer>대시보드 · 한국교통연구원 교통빅데이터연구본부</footer>

<script>
  var WORKER_URL = "https://notion-proxy.ekqls0458.workers.dev";
  var PROJECTS = ["국가교통조사사업","자율주행R&D","탄소공간지도R&D","교통SOC R&D","데이터스페이스R&D"];
  var PROJ_SHORT = { "국가교통조사사업":"국가교통조사","자율주행R&D":"자율주행","탄소공간지도R&D":"탄소공간지도",
    "교통SOC R&D":"교통SOC","데이터스페이스R&D":"데이터스페이스","기타":"기타","공통":"공통" };
  var PROJ_STYLE = {
    "국가교통조사사업":{c:"#2c5fbf",bg:"#e8eefb"},
    "자율주행R&D":{c:"#1f8a5b",bg:"#eafaf0"},
    "탄소공간지도R&D":{c:"#b5760a",bg:"#fbf1de"},
    "교통SOC R&D":{c:"#7a4ec2",bg:"#efeafa"},
    "데이터스페이스R&D":{c:"#c2408a",bg:"#fbe8f3"},
    "기타":{c:"#5a6680",bg:"#eef1f6"},
    "공통":{c:"#5a6680",bg:"#eef1f6"}
  };
  var DOW = ["일","월","화","수","목","금","토"];

  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function pad2(n){ return (n<10?"0":"")+n; }
  function iso(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function parseYMD(s){ if(!s) return null; var p=s.slice(0,10).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function fmtMD(s){ var d=parseYMD(s); return d?pad2(d.getMonth()+1)+"."+pad2(d.getDate()):""; }
  function fmtMDW(s){ var d=parseYMD(s); return d?pad2(d.getMonth()+1)+"."+pad2(d.getDate())+"("+DOW[d.getDay()]+")":""; }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function startOfWeekMon(d){ var x=new Date(d); x.setHours(0,0,0,0); var dow=x.getDay(); var off=(dow===0)?-6:(1-dow); x.setDate(x.getDate()+off); return x; }
  var TODAY = new Date(); TODAY.setHours(0,0,0,0);
  var TODAY_ISO = iso(TODAY);
  var WK_START = startOfWeekMon(TODAY);
  var WK_END = addDays(WK_START,4);
  function inThisWeek(dateStr){ return dateStr && dateStr>=iso(WK_START) && dateStr<=iso(WK_END); }
  function isoWeekNum(ymdStr){
    var d=new Date(ymdStr+"T00:00:00");
    var target=new Date(d.valueOf()); var dayNr=(d.getDay()+6)%7;
    target.setDate(target.getDate()-dayNr+3);
    var firstThu=target.valueOf();
    target.setMonth(0,1);
    if(target.getDay()!==4){ target.setMonth(0,1+((4-target.getDay())+7)%7); }
    return 1+Math.ceil((firstThu-target)/604800000);
  }
  function projStyle(p){ return PROJ_STYLE[p] || PROJ_STYLE["기타"]; }
  function projTag(p){ var st=projStyle(p); return "<span style=\"display:inline-block;font-size:10px;font-weight:700;padding:3px 7px;border-radius:9px;white-space:nowrap;background:"+st.bg+";color:"+st.c+"\">"+esc(PROJ_SHORT[p]||p)+"</span>"; }
  function donutGrad(pct,color){ return "conic-gradient("+color+" "+pct+"%, var(--line) "+pct+"% 100%)"; }

  var DATA = {};
  function nav(url){ window.location.href = url; }

  async function load(){
    document.getElementById("content").innerHTML="<div class=\"state\">불러오는 중…</div>";
    document.getElementById("todayLabel").textContent = TODAY.getFullYear()+"년 "+(TODAY.getMonth()+1)+"월 "+TODAY.getDate()+"일("+DOW[TODAY.getDay()]+") · "+(isoWeekNum(TODAY_ISO)-1)+"주차";
    try {
      var res=await fetch(WORKER_URL+"?scope=dashboard",{cache:"no-store"});
      var data=await res.json();
      DATA=data;
      render();
    } catch(e){
      document.getElementById("content").innerHTML="<div class=\"state\">불러오기 실패: "+esc(String(e))+"</div>";
    }
  }

  // 회의요약이 비어있으면 "검토 필요"로 간주 (weekly-meeting.html의 "아직 요약이 작성되지 않았습니다" 상태와 동일 기준)
  // 검토필요: 회의 데이터가 들어온 뒤 기본 "검토필요"이며, "이숭봉"이 코멘트를 달면 해제됨 (worker.js scope=dashboard에서 계산해서 내려줌)
  function meetingIsDone(m){
    if(m.date < TODAY_ISO) return true;
    if(m.date > TODAY_ISO) return false;
    // 오늘인 경우: 시간까지 지났으면 완료 (시간 정보 없으면 날짜만으로 판단 - 아직 예정으로 봄)
    var t = (m.time||"").split("~")[0].trim();
    if(!t) return false;
    var mm = t.match(/^(\d{1,2}):(\d{2})/);
    if(!mm) return false;
    var meetingMinutes = (+mm[1])*60 + (+mm[2]);
    var now = new Date();
    var nowMinutes = now.getHours()*60 + now.getMinutes();
    return nowMinutes >= meetingMinutes;
  }
  function meetingsOfProject(name){
    return (DATA.meetings||[]).filter(function(m){ return m.project===name && inThisWeek(m.date); })
      .map(function(m){
        var done = meetingIsDone(m);
        return {
          id:m.id, dateText: fmtMDW(m.date), summary: (m.summary&&m.summary.trim())?m.summary:(m.headingList||m.title),
          needsReview: !!m.needsReview, done: done
        };
      })
      .sort(function(a,b){ return (b.needsReview?1:0)-(a.needsReview?1:0); });
  }
  function schedulesOfProject(name){
    return (DATA.schedule||[]).filter(function(s){
      return (s.type==="과제"||s.type==="출장") && s.project===name && inThisWeek(s.start);
    }).sort(function(a,b){ return a.start<b.start?-1:1; })
      .map(function(s){ return { dateText: fmtMDW(s.start)+(s.time?" "+s.time.split("~")[0]:""), label: s.title }; });
  }
  function buildTeamCard(){
    var info=(DATA.projectInfo||[]).slice().sort(function(a,b){return (a.order||999)-(b.order||999);});
    if(!info.length) return "";
    var tagboxes=[], pmrows=[], mtglists=[], schlists=[];
    info.forEach(function(p){
      var st=projStyle(p.name);
      var main=(p.main&&p.main.length)?p.main.join(", "):"-";
      var pi=(p.pi||[]).map(function(n){return "<span class=\"pi-chip\">"+esc(n)+"</span>";}).join("");
      var sub=(p.sub||[]).map(function(n){return "<span class=\"res-chip\">"+esc(n)+"</span>";}).join("");
      var mtgs=meetingsOfProject(p.name);
      var mtgHtml = mtgs.length ? mtgs.map(function(m){
        return "<div class=\"mtg-item click\" data-nav=\"weekly-meeting.html?meeting="+encodeURIComponent(m.id)+"\"><div class=\"mtg-top\"><span class=\"mtg-l\">"
          +(m.needsReview?"<span class=\"mtg-review\">검토 필요</span>":"")
          +"<span class=\"mtg-sum\">"+esc(m.summary)+"</span></span>"
          +"<span class=\"mtg-stat\" style=\""+(m.done?"background:var(--bg);color:var(--muted)":"background:var(--blue-soft);color:var(--blue)")+"\">"+(m.done?"완료":"예정")+"</span></div>"
          +"<span class=\"mtg-date\">"+m.dateText+"</span></div>";
      }).join("") : "<div class=\"mtg-empty\">주간회의자료 미등록</div>";
      var scheds=schedulesOfProject(p.name);
      var schHtml = scheds.length ? scheds.map(function(s){
        return "<div class=\"sch-item\"><span class=\"d\">"+s.dateText+"</span><span class=\"l\">"+esc(s.label)+"</span></div>";
      }).join("") : "<div class=\"sch-empty\">일정 없음</div>";

      tagboxes.push("<div class=\"tagbox\" style=\"background:"+st.bg+";color:"+st.c+"\">"+esc(PROJ_SHORT[p.name]||p.name)+"</div>");
      pmrows.push("<div class=\"pm-row\">"
        +"<div class=\"pi-row\">"+(pi||"<span class=\"pi-chip\">-</span>")+"</div>"
        +"<div class=\"pi-row\"><span class=\"pm-chip\">"+esc(main)+"</span></div>"
        +"<div class=\"res-wrap\">"+sub+"</div></div>");
      mtglists.push("<div class=\"mtg-list\">"+mtgHtml+"</div>");
      schlists.push("<div class=\"sch-list\">"+schHtml+"</div>");
    });
    // 순서대로(태그박스 5개 → pm-row 5개 → mtg-list 5개 → sch-list 5개) 나열하면
    // 그리드가 자동으로 4행×5열로 배치하고, 각 행의 높이는 그 행에서 제일 큰 셀 기준으로 통일됨(진짜 정렬 보장)
    var cols = tagboxes.join("") + pmrows.join("") + mtglists.join("") + schlists.join("");
    return "<div class=\"dcard\"><div class=\"dcard-h\"><div class=\"l\"><span class=\"bar\"></span><h3>과제 현황</h3></div>"
      +"<div class=\"team-legend\"><span class=\"lg\"><span class=\"dot\" style=\"background:var(--navy)\"></span>연구책임자</span>"
      +"<span class=\"lg\"><span class=\"dot\" style=\"background:var(--blue-soft)\"></span>실무연구진</span>"
      +"<span class=\"lg\"><span class=\"dot\" style=\"background:var(--bg);border:1px solid var(--line-2)\"></span>연구진</span></div></div>"
      +"<div class=\"team-grid\">"+cols+"</div></div>";
  }



  function displayPerfProgress(g){ return g.status==="완료" ? 100 : g.progress; }
  function buildPerfCard(){
    var year=TODAY.getFullYear();
    var perf=(DATA.perf||[]).filter(function(g){
      if(!g.start_year) return true;
      var endY = g.due ? parseInt(g.due.slice(0,4),10) : g.start_year;
      return year>=g.start_year && year<=endY;
    });
    var doing=perf.filter(function(g){return g.status==="진행중";}).length;
    var groups={};
    perf.forEach(function(g){ (groups[g.project]=groups[g.project]||[]).push(g); });
    var donuts=Object.keys(groups).map(function(proj){
      var items=groups[proj];
      var quant=items.filter(function(g){return g.type==="정량";});
      var qual=items.filter(function(g){return g.type==="정성";});
      var avg=function(arr){ return arr.length?Math.round(arr.reduce(function(s,g){return s+displayPerfProgress(g);},0)/arr.length):0; };
      var st=projStyle(proj);
      return "<div class=\"donut-unit\"><div class=\"short\">"+esc(PROJ_SHORT[proj]||proj)+"</div><div class=\"donut-pair\">"
        +"<div><div class=\"donut\"><div class=\"donut-fill\" style=\"background:"+donutGrad(avg(quant),st.c)+"\"></div><div class=\"donut-hole\">"+avg(quant)+"%</div></div><div class=\"donut-lab\">정량</div></div>"
        +"<div><div class=\"donut\"><div class=\"donut-fill\" style=\"background:"+donutGrad(avg(qual),st.c)+"\"></div><div class=\"donut-hole\">"+avg(qual)+"%</div></div><div class=\"donut-lab\">정성</div></div>"
        +"</div></div>";
    });
    var body = donuts.length ? "<div class=\"donut-row\">"+donuts.join("<div class=\"donut-sep\"></div>")+"</div>" : "<div class=\"wk-empty\">등록된 성과 목표가 없습니다.</div>";
    return "<div class=\"dcard click\" data-nav=\"performance.html\"><div class=\"dcard-h\"><div class=\"l\"><span class=\"bar\"></span><h3>성과 현황</h3></div>"
      +"<span class=\"r\">진행중 "+doing+"건 ›</span></div>"+body+"</div>";
  }

  function buildConsignCard(){
    var list=DATA.consignments||[];
    var rows = list.length ? list.map(function(c){
      var period=(c.start||c.end)?(fmtMD(c.start)+"~"+fmtMD(c.end)):"-";
      return "<div class=\"consign-item\" data-nav=\"outsourced.html?project="+encodeURIComponent(c.id)+"\">"
        +"<div class=\"consign-top\"><span class=\"t\">"+esc(c.title)+"</span><span class=\"b\">"+esc(c.budget||"-")+"</span></div>"
        +"<div class=\"consign-sub\">"+esc(c.org||"-")+" · "+period+"</div></div>";
    }).join("") : "<div class=\"wk-empty\">등록된 위탁과제가 없습니다.</div>";
    return "<div class=\"dcard click\" data-nav=\"outsourced.html\"><div class=\"dcard-h\"><div class=\"l\"><span class=\"bar\"></span><h3>위탁과제 현황</h3></div>"
      +"<span class=\"r\">"+list.length+"건 진행중 ›</span></div>"+rows+"</div>";
  }

  // ===== 근태(휴가/외출/출장/재택근무) 분류 =====
  var ATT_GROUP = { "출장":"출장", "외출":"외출", "재택근무":"재택근무",
    "휴가":"휴가","오전반차":"휴가","오후반차":"휴가","병가":"휴가","공가":"휴가","건강검진":"휴가" };
  var ATT_TYPE_STYLE = { "출장":{c:"#0f766e",bg:"#d9f0ec"}, "외출":{c:"#7c3aed",bg:"#efe8fb"}, "휴가":{c:"#b45309",bg:"#fdeede"}, "재택근무":{c:"#0369a1",bg:"#e0f2fe"} };
  function endOf(ev){ return ev.end || ev.start; }
  function isMulti(ev){ return ev.end && ev.end!==ev.start; }
  function containsDay(ev, dIso){ return ev.start && ev.start<=dIso && endOf(ev)>=dIso; }
  function containsToday(ev){ return containsDay(ev, TODAY_ISO); }
  function startTime(ev){ return (ev.time||"").split("~")[0].trim(); }
  function displayPerson(ev){ return ev.attendees || ev.person || ""; }
  function attTodayByType(dIso){
    var out={출장:[], 외출:[], 휴가:[], 재택근무:[]};
    (DATA.schedule||[]).forEach(function(s){
      var g=ATT_GROUP[s.type];
      if(g && containsDay(s, dIso)) out[g].push(s);
    });
    return out;
  }

  // ===== 미니 캘린더 (이번 달, 오늘 강조, 일정 있는 날 점) =====
  var SELECTED_DAY = null; // null이면 오늘
  // 날짜(시간) 표기: 시작시간만, 다일이면 범위
  function dateTimeText(ev){
    var t=startTime(ev);
    var d=isMulti(ev) ? (fmtMD(ev.start)+" ~ "+fmtMD(ev.end)) : fmtMDW(ev.start);
    return d+(t?" "+t:"");
  }
  // 목적(장소): 제목 + (장소) — 없으면 빈 문자열(줄 자체 생략)
  function purposeText(ev){
    if(!ev.title) return "";
    return ev.title + (ev.location ? " ("+ev.location+")" : "");
  }
  function attLine(ev){
    var nm=displayPerson(ev)||"-";
    if(ev.type==="출장" || ev.type==="외출"){
      var purpose=purposeText(ev);
      return "<div class=\"cal-col-ev\"><span class=\"nm\">"+esc(nm)+"</span>"
        +"<span class=\"sub\">"+esc(dateTimeText(ev))+"</span>"
        +(purpose?"<span class=\"sub\">"+esc(purpose)+"</span>":"")+"</div>";
    }
    // 휴가/재택근무: 이름 · 날짜(휴가는 구분도 같은 줄에 표기)
    var dateLine = isMulti(ev) ? (fmtMD(ev.start)+" ~ "+fmtMD(ev.end)) : fmtMDW(ev.start);
    // "휴가" 칸 안에서는 굳이 또 "휴가"라고 반복 표시할 필요 없음 → 오전반차/병가 등 구체적인 구분만 표시
    if(ev.type==="휴가" && ev.vacation && ev.vacation!=="휴가") dateLine += " · "+ev.vacation;
    return "<div class=\"cal-col-ev\"><span class=\"nm\">"+esc(nm)+"</span>"
      +"<span class=\"sub\">"+esc(dateLine)+"</span></div>";
  }
  function attColumn(label, evs){
    var body = evs.length ? evs.map(attLine).join("") : "<span class=\"cal-col-empty\">-</span>";
    return "<div class=\"cal-side-col\"><div class=\"cal-col-lab\">"+label+"</div><div class=\"cal-col-body\">"+body+"</div></div>";
  }
  function buildCalendarCard(){
    var y=TODAY.getFullYear(), m=TODAY.getMonth();
    var selDay = SELECTED_DAY || TODAY.getDate();
    var selIso = y+"-"+pad2(m+1)+"-"+pad2(selDay);
    var first=new Date(y,m,1), startDow=first.getDay(), daysInMonth=new Date(y,m+1,0).getDate();
    var evDays={};
    (DATA.schedule||[]).forEach(function(s){ if(s.start && s.start.slice(0,7)===iso(TODAY).slice(0,7)) evDays[s.start.slice(8,10)]=true; });
    (DATA.meetings||[]).forEach(function(s){ if(s.date && s.date.slice(0,7)===iso(TODAY).slice(0,7)) evDays[s.date.slice(8,10)]=true; });
    var dowHtml=DOW.map(function(x){return "<div>"+x+"</div>";}).join("");
    var cells="";
    for(var i=0;i<startDow;i++) cells+="<div class=\"cell\"></div>";
    for(var d=1; d<=daysInMonth; d++){
      var isToday=(d===TODAY.getDate());
      var isSel=(d===selDay);
      var hasEv=evDays[pad2(d)];
      cells+="<div class=\"cell\" data-day=\""+d+"\"><div class=\"num"+(isToday?" today":"")+(isSel&&!isToday?" sel":"")+"\">"+d+"</div><div class=\"dot"+(hasEv&&!isToday?"":" none")+"\"></div></div>";
    }
    var selLabel = (selDay===TODAY.getDate()) ? "오늘" : (m+1)+"."+selDay;
    var ATT_TITLE_EXCLUDE = ["육아휴직","출근"]; // 정식 유형이 없어 "기타"로 분류되지만 일정 목록에선 제외해야 하는 항목
    var upcoming=(DATA.schedule||[]).concat((DATA.meetings||[]).map(function(m2){return {start:m2.date, title:(m2.summary||m2.title)};}))
      .filter(function(e){ return (e.start||e.date)===selIso; })
      .filter(function(e){
        if(ATT_GROUP[e.type]) return false; // 휴가/오전반차/오후반차/병가/공가/건강검진/외출/재택근무는 근태 4칸에서 별도 표시
        if(e.title && ATT_TITLE_EXCLUDE.some(function(k){ return e.title.indexOf(k)>=0; })) return false;
        return true;
      })
      .slice(0,6)
      .map(function(e){
        var t=startTime(e);
        var lbl=(t?t+" ":"")+(e.title||e.person||"-");
        return "<div class=\"cal-col-ev\">"+esc(lbl)+"</div>";
      }).join("");
    var att=attTodayByType(selIso);
    return "<div class=\"dcard\"><div class=\"dcard-h\"><div class=\"l\"><span class=\"bar\"></span><h3>캘린더</h3></div>"
      +"<span class=\"r click\" data-nav=\"schedule.html\">"+(m+1)+"월 ›</span></div>"
      +"<div class=\"cal-grid\">"
      +"<div><div class=\"minical-dow\">"+dowHtml+"</div><div class=\"minical-days\">"+cells+"</div></div>"
      +"<div class=\"cal-side-col\"><div class=\"cal-col-lab\">"+selLabel+" 일정</div><div class=\"cal-col-body\">"+(upcoming||"<span class=\"cal-col-empty\">없음</span>")+"</div></div>"
      +attColumn("출장",att.출장)+attColumn("외출",att.외출)+attColumn("휴가",att.휴가)+attColumn("재택근무",att.재택근무)
      +"</div></div>";
  }


  function render(){
    var html = buildTeamCard()
      + "<div class=\"widget-grid\">"
      + buildPerfCard() + buildConsignCard()
      + "</div>"
      + buildCalendarCard();
    document.getElementById("content").innerHTML = html;
  }

  document.getElementById("content").addEventListener("click", function(e){
    var day=e.target.closest("[data-day]");
    if(day){ SELECTED_DAY=parseInt(day.dataset.day,10); render(); return; }
    var t=e.target.closest("[data-nav]");
    if(t) nav(t.dataset.nav);
  });
  document.getElementById("refreshBtn").addEventListener("click", load);

  (function(){
    var root=document.documentElement, btn=document.getElementById("themeBtn");
    function set(t){ root.setAttribute("data-theme",t); btn.textContent=(t==="dark"?"☀️ 라이트모드":"🌙 다크모드"); }
    btn.addEventListener("click", function(){ set(root.getAttribute("data-theme")==="dark"?"light":"dark"); });
  })();

  load();
</script>
</body>
</html>
