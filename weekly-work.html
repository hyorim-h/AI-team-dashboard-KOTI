<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간업무 작성 · AI빅데이터연구팀</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
<style>
  :root{
    --navy:#16265e; --navy-2:#1a2942; --blue:#2c5fbf; --blue-soft:#e8eefb;
    --red:#c8273c; --red-soft:#fdeaec; --green:#1f8a5b; --green-soft:#e3f5ec;
    --orange:#b9770a; --orange-soft:#fff4e0; --purple:#7a4ec2; --purple-soft:#efeafa;
    --bg:#eef1f6; --surface:#ffffff; --line:#dfe5ef; --line-2:#cdd6ec;
    --text:#16265e; --text-2:#5a6680; --muted:#9fb0cf;
    --shadow:0 1px 3px rgba(16,38,94,.06),0 8px 24px rgba(16,38,94,.07);
    --radius:6px; --maxw:1500px;
  }
  html[data-theme="dark"]{
    --navy:#0d1836; --navy-2:#0a1228; --blue:#5b8def; --blue-soft:#16233f;
    --red:#ff7a7a; --red-soft:#3a1717; --green:#43c794; --green-soft:#103024;
    --orange:#e0a94a; --orange-soft:#3a2c17; --purple:#a888e0; --purple-soft:#241a3a;
    --bg:#0a1020; --surface:#111c33; --line:#1e2d4d; --line-2:#26375c;
    --text:#e7eef7; --text-2:#a8b6d4; --muted:#6b7ba0;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  }
  html[data-theme="dark"] .cal-cell.out{background:#0c1428;border-color:transparent}
  html[data-theme="dark"] .cal-cell.wk-a{background:#14203a}
  html[data-theme="dark"] .cal-cell.wk-p{background:#152740}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo",-apple-system,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

  .utilbar{background:var(--navy-2);color:#cdd6ec;font-size:12.5px}
  .utilbar .in{max-width:var(--maxw);margin:0 auto;padding:7px 28px;display:flex;justify-content:flex-end;gap:16px;align-items:center}
  .utilbar a{color:#cdd6ec;text-decoration:none}
  .utilbar .sep{color:#3a4a72}
  .util-toggle{background:none;border:none;color:#cdd6ec;cursor:pointer;font-size:12.5px}

  .head{background:var(--surface);border-bottom:1px solid var(--line)}
  .head .in{max-width:var(--maxw);margin:0 auto;padding:16px 28px;display:flex;align-items:center;gap:16px}
  .logo{height:44px}
  .head h1{font-size:20px;font-weight:800;margin:0;color:var(--navy)}
  .head-actions{margin-left:auto;display:flex;gap:10px}
  .hbtn{font-size:13.5px;font-weight:700;padding:9px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--line-2);
    background:var(--surface);color:var(--navy)}
  .hbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .hbtn:hover{filter:brightness(.97)}

  nav.tabs{background:var(--navy)}
  nav.tabs .in{max-width:var(--maxw);margin:0 auto;padding:0 28px;display:flex;gap:2px;flex-wrap:wrap}
  nav.tabs a{color:#b9c8e8;text-decoration:none;font-size:14.5px;font-weight:700;padding:14px 20px;border-bottom:3px solid transparent}
  nav.tabs a:hover{color:#fff}
  nav.tabs a.cur{color:#fff;background:var(--blue);border-bottom-color:#fff}

  .ptitle{padding:26px 0 18px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .ptitle .crumb{font-size:12.5px;color:var(--text-2);font-weight:600}
  .ptitle h2{font-size:26px;font-weight:850;margin:2px 0 0;color:var(--navy)}
  .week-nav{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line-2);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow)}
  .week-nav button{border:none;background:none;color:var(--navy);cursor:pointer;font-size:16px;padding:2px 6px}
  .week-nav .wlabel{font-size:14px;font-weight:800;color:var(--navy);min-width:210px;text-align:center}

  .filterbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .filterbar .flabel{font-size:13px;font-weight:800;color:var(--navy);margin-right:2px}
  .filterbar select{border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:13px;
    background:var(--surface);color:var(--text);font-family:inherit}
  .filterbar .cnt{margin-left:auto;font-size:13px;color:var(--text-2);font-weight:600}
  .filterbar .reset{border:1px solid var(--line-2);background:var(--surface);color:var(--navy);border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
  .card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card-h .bar{width:4px;height:18px;background:var(--blue);border-radius:2px}
  .card-h h3{font-size:16px;font-weight:800;margin:0;color:var(--navy)}
  .card-h .sub{font-size:12.5px;color:var(--text-2);font-weight:600}
  .card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .addbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--navy);border-radius:8px;
    padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
  .addbtn:hover{background:var(--blue-soft)}

  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text-2);font-weight:600}
  .cal-legend .lg{display:inline-flex;align-items:center;gap:4px}
  .cal-legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  .cal-legend .wk{width:15px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--line-2)}
  .cal-wrap{padding:16px 20px}
  .cal-dowrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;text-align:center}
  .cal-dow{font-size:11.5px;font-weight:700;color:var(--text-2)}
  .cal-dow.sun{color:var(--red)} .cal-dow.sat{color:var(--blue)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .cal-cell{height:96px;border:1px solid var(--line);border-radius:7px;padding:8px 9px;background:var(--surface);
    display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .cal-cell.out{background:#f6f8fc;border-color:transparent}
  .cal-cell.wk-a{background:#f6f7fa}
  .cal-cell.wk-p{background:#eef3fd}
  .cal-daynum{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:1px}
  .cal-cell.out .cal-daynum{color:var(--muted)}
  .cal-cell.sun .cal-daynum{color:var(--red)} .cal-cell.sat .cal-daynum{color:var(--blue)}
  .cal-ev{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.45;cursor:pointer}
  .cal-more{font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;padding:1px 6px}
  .cal-more:hover{color:var(--blue);text-decoration:underline}
  /* 팝오버 */
  .popover{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
    box-shadow:0 8px 28px rgba(16,38,94,.18);padding:12px 14px;min-width:240px;max-width:320px;display:none}
  .popover.open{display:block}
  .popover .pv-date{font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:8px}
  .popover .pv-ev{font-size:12px;font-weight:600;padding:5px 8px;border-radius:4px;margin-bottom:4px;display:flex;gap:6px;align-items:center}
  .popover .pv-ev .pv-tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:3px;white-space:nowrap}

  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;font-size:12px;font-weight:800;color:var(--text-2);padding:11px 14px;border-bottom:2px solid var(--line);white-space:nowrap}
  .tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tbody tr{cursor:pointer;transition:background .12s}
  .tbl tbody tr:hover{background:var(--blue-soft)}
  .tbl .col-no{width:44px;color:var(--muted);font-weight:700}
  .tbl .t-title{font-weight:700;color:var(--navy)}
  .tbl .t-title.dim{color:var(--muted);text-decoration:line-through}
  .tbl .t-sub{color:var(--text-2)}
  .ptag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:4px;white-space:nowrap}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:4px;white-space:nowrap}
  .empty-row td{text-align:center;color:var(--muted);padding:26px;font-size:13px}

  .state{padding:48px;text-align:center;color:var(--text-2)}
  footer{padding:30px 0 48px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>

</div></div>

<div class="wrap">
  <div class="ptitle">

      <div class="crumb">홈 · 주간업무 작성</div>

<div class="popover" id="popover"></div>

<script>
  var WORKER_URL = "https://notion-proxy.ekqls0458.workers.dev";

  var PROJECTS = ["국가교통조사사업","자율주행R&D","탄소공간지도R&D","교통SOC R&D","데이터스페이스R&D","기타"];
  var PROJ_SHORT = { "국가교통조사사업":"국가교통조사", "자율주행R&D":"자율주행", "탄소공간지도R&D":"탄소지도",
    "교통SOC R&D":"교통SOC", "데이터스페이스R&D":"데이터스페이스", "기타":"기타" };
  var PROJ_STYLE = {
    "국가교통조사사업": {c:"#2c5fbf", bg:"var(--blue-soft)"},
    "자율주행R&D":     {c:"#1f8a5b", bg:"var(--green-soft)"},
    "탄소공간지도R&D": {c:"#b9770a", bg:"var(--orange-soft)"},
    "교통SOC R&D":     {c:"#7a4ec2", bg:"var(--purple-soft)"},
    "데이터스페이스R&D":{c:"#c8273c", bg:"var(--red-soft)"},
    "기타":            {c:"#5a6680", bg:"#eef1f6"}
  };
  var OWNERS = ["이종우","전준수","이채영","한효림","김예원","정승환","심지윤","정정호"];

  var DATA = { week:"", achievements:[], plans:[] };
  var VIEW = { y:2026, mo:5 };
  var PERIOD = { aStart:"", aEnd:"", pStart:"", pEnd:"" };
  var FILTER = { project:"", owner:"", status:"" };

  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function ptag(proj){
    var st = PROJ_STYLE[proj] || PROJ_STYLE["기타"];
    return '<span class="ptag" style="color:'+st.c+';background:'+st.bg+'">'+esc(PROJ_SHORT[proj]||proj||"기타")+'</span>';
  }
  function fmtDateDow(ymd){
    if(!ymd) return "-";
    var p=ymd.split("-"); var d=new Date(ymd+"T00:00:00");
    var dows=["일","월","화","수","목","금","토"];
    return (+p[1])+"."+("0"+(+p[2])).slice(-2)+"("+dows[d.getDay()]+")";
  }
  function z(n){ return (n<10?"0":"")+n; }
  function ymd(d){ return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }

  async function load(){
    try {
      var res = await fetch(WORKER_URL, {cache:"no-store"});
      var data = await res.json();
      var work = data.work || {};
      DATA.week = work.week || "";
      DATA.achievements = work.achievements || [];
      DATA.plans = work.plans || [];
      computePeriod();
      initView();
      buildFilterOptions();
      render();
    } catch(e){
      document.getElementById("content").innerHTML = '<div class="state">불러오기 실패: '+esc(String(e))+'</div>';
    }
  }

  function computePeriod(){
    var aDates = DATA.achievements.map(function(x){return x.date;}).filter(Boolean).sort();
    var pDates = DATA.plans.map(function(x){return x.date;}).filter(Boolean).sort();
    PERIOD.aStart = aDates[0]||""; PERIOD.aEnd = aDates[aDates.length-1]||"";
    PERIOD.pStart = pDates[0]||""; PERIOD.pEnd = pDates[pDates.length-1]||"";
  }

  function initView(){
    var base = PERIOD.aStart || PERIOD.pStart;
    var d = base ? new Date(base+"T00:00:00") : new Date();
    VIEW.y = d.getFullYear(); VIEW.mo = d.getMonth();
  }

  function buildFilterOptions(){
    var fp=document.getElementById("fProject");
    PROJECTS.forEach(function(p){ var o=document.createElement("option"); o.value=p; o.textContent=p; fp.appendChild(o); });
    var fo=document.getElementById("fOwner");
    OWNERS.forEach(function(n){ var o=document.createElement("option"); o.value=n; o.textContent=n; fo.appendChild(o); });
    var fs=document.getElementById("fStatus");
    ["수정됨","삭제필요","예정","완료"].forEach(function(s){ var o=document.createElement("option"); o.value=s; o.textContent=s; fs.appendChild(o); });
  }

  function weekLabelText(){
    var wk = DATA.week ? (" ("+DATA.week.split("-")[1]+"주차)") : "";
    if(PERIOD.aStart && PERIOD.aEnd) return PERIOD.aStart+" ~ "+PERIOD.aEnd.slice(5)+wk;
    return DATA.week || "주간업무";
  }

  function applyFilter(rows, isPlan){
    return rows.filter(function(r){
      if(FILTER.project && r.project!==FILTER.project) return false;
      if(FILTER.owner){
        var cand = (isPlan? r.writer : r.modifier) || "";
        if(cand!==FILTER.owner) return false;
      }
      if(FILTER.status){
        var stt = isPlan ? (r.modified?"수정됨":((r.status==="완료"||r.status==="작성완료")?"완료":"예정"))
                         : (r.modified?"수정됨":(r.status||""));
        if(stt!==FILTER.status) return false;
      }
      return true;
    });
  }

  function render(){
    document.getElementById("weekLabel").textContent = weekLabelText();
    var box = document.getElementById("content");
    box.innerHTML = calendarCard() + achieveCard() + planCard();
    var total = DATA.achievements.length + DATA.plans.length;
    document.getElementById("filterCnt").textContent = "조회 " + total + "건";
  }

  function calendarCard(){
    var y=VIEW.y, mo=VIEW.mo;
    var byDate = {};
    DATA.achievements.forEach(function(r){ if(r.date){ (byDate[r.date]=byDate[r.date]||[]).push({r:r, plan:false}); } });
    DATA.plans.forEach(function(r){ if(r.date){ (byDate[r.date]=byDate[r.date]||[]).push({r:r, plan:true}); } });

    var first=new Date(y,mo,1), startDow=first.getDay();
    var gridStart=new Date(y,mo,1); gridStart.setDate(1-startDow);
    var dows=["일","월","화","수","목","금","토"];

    // 요일 헤더
    var dowRow='<div class="cal-dowrow">'+dows.map(function(d,i){
      return '<div class="cal-dow'+(i===0?" sun":i===6?" sat":"")+'">'+d+'</div>';
    }).join("")+'</div>';

    // 주별 행
    var weeks="";
    for(var w=0; w<6; w++){
      var cells="";
      for(var di=0; di<7; di++){
        var cur=new Date(gridStart); cur.setDate(gridStart.getDate()+w*7+di);
        var ds=ymd(cur), inMonth=(cur.getMonth()===mo), dow=cur.getDay();
        var evs=byDate[ds]||[];
        var wkCls="";
        if(PERIOD.aStart && ds>=PERIOD.aStart && ds<=PERIOD.aEnd) wkCls=" wk-a";
        else if(PERIOD.pStart && ds>=PERIOD.pStart && ds<=PERIOD.pEnd) wkCls=" wk-p";
        var cls="cal-cell"+(inMonth?"":" out")+wkCls+(dow===0?" sun":dow===6?" sat":"");
        var evHtml=evs.slice(0,2).map(function(e){
          var st=PROJ_STYLE[e.r.project]||PROJ_STYLE["기타"];
          var pre=e.plan?"계획 · ":"";
          return '<div class="cal-ev" style="color:'+st.c+';background:'+st.bg+'" data-evday="'+ds+'">'+esc(pre+(e.r.title||""))+'</div>';
        }).join("");
        if(evs.length>2) evHtml+='<div class="cal-more" data-more="'+ds+'">+'+(evs.length-2)+'건 더보기</div>';
        cells+='<div class="'+cls+'"><div class="cal-daynum">'+cur.getDate()+'</div>'+evHtml+'</div>';
      }
      weeks+='<div class="cal-week">'+cells+'</div>';
      // 다음 주 첫날이 이미 다음달로 넘어갔고 이번달 안 걸치면 종료
      var chk=new Date(gridStart); chk.setDate(gridStart.getDate()+(w+1)*7);
      if(chk.getMonth()!==mo && chk>new Date(y,mo+1,0)) break;
    }

    // caption: 실적주/계획주 범위
    var cap="";
    if(PERIOD.aStart && PERIOD.aEnd) cap+="실적주 "+PERIOD.aStart.slice(5).replace("-",".")+"~"+PERIOD.aEnd.slice(5).replace("-",".");
    if(PERIOD.pStart && PERIOD.pEnd) cap+=" · 계획주 "+PERIOD.pStart.slice(5).replace("-",".")+"~"+PERIOD.pEnd.slice(5).replace("-",".");

    var legend='<div class="cal-legend">'
      +'<span class="lg"><span class="wk" style="background:#f6f7fa"></span>이번 주(실적)</span>'
      +'<span class="lg"><span class="wk" style="background:#eef3fd"></span>다음 주(계획)</span>'
      +'<span style="opacity:.4">|</span>'
      +PROJECTS.slice(0,5).map(function(p){var st=PROJ_STYLE[p];return '<span class="lg"><span class="dot" style="background:'+st.c+'"></span>'+esc(PROJ_SHORT[p])+'</span>';}).join("")
      +'</div>';
    return '<div class="card">'
      +'<div class="card-h"><span class="bar"></span><h3>팀 캘린더</h3>'
      +'<span class="sub">'+y+'년 '+(mo+1)+'월</span>'
      +(cap?'<span class="sub" style="color:var(--muted)">'+esc(cap)+'</span>':'')
      +'<div class="right">'+legend
      +'<button class="addbtn" id="calPrev">‹</button><button class="addbtn" id="calNext">›</button></div></div>'
      +'<div class="cal-wrap">'+dowRow+weeks+'</div></div>';
  }

  function achieveCard(){
    var rows = applyFilter(DATA.achievements, false);
    var body = rows.length ? rows.map(function(r,i){
      var stt = r.modified ? '<span class="badge" style="color:var(--orange);background:var(--orange-soft)">수정됨'+(r.modifier?" · "+esc(r.modifier):"")+'</span>'
              : (r.status==="삭제필요" ? '<span class="badge" style="color:var(--red);background:var(--red-soft)">삭제필요</span>' : '-');
      var titleCls = r.status==="삭제필요" ? "t-title dim" : "t-title";
      return '<tr data-kind="achieve" data-idx="'+DATA.achievements.indexOf(r)+'">'
        + '<td class="col-no">'+(i+1)+'</td>'
        + '<td>'+ptag(r.project)+'</td>'
        + '<td class="'+titleCls+'">'+esc(r.title)+'</td>'
        + '<td class="t-sub">'+fmtDateDow(r.date)+(r.time?" "+esc(r.time):"")+'</td>'
        + '<td class="t-sub">'+esc(r.location||"-")+'</td>'
        + '<td class="t-sub">'+esc(r.modifier||"-")+'</td>'
        + '<td>'+stt+'</td>'
        + '<td class="t-sub">'+esc(r.modified_at||"-")+'</td>'
        + '</tr>';
    }).join("") : '<tr class="empty-row"><td colspan="8">업무실적이 없습니다.</td></tr>';
    return '<div class="card">'
      +'<div class="card-h"><span class="bar" style="background:var(--red)"></span><h3>업무실적</h3>'
      +'<span class="sub">이번 주 수행한 업무 · '+DATA.achievements.length+'건</span>'
      +'<div class="right"><button class="addbtn" data-add="achieve">+ 항목 추가</button></div></div>'
      +'<table class="tbl"><thead><tr>'
      +'<th>No</th><th>과제</th><th>제목</th><th>일시</th><th>장소</th><th>담당자</th><th>상태</th><th>수정일시</th>'
      +'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  function planCard(){
    var rows = applyFilter(DATA.plans, true);
    var body = rows.length ? rows.map(function(r,i){
      var done = r.status==="완료" || r.status==="작성완료";
      var stt = r.modified ? '<span class="badge" style="color:var(--orange);background:var(--orange-soft)">수정됨</span>'
              : done ? '<span class="badge" style="color:var(--green);background:var(--green-soft)">완료</span>'
              : '<span class="badge" style="color:var(--blue);background:var(--blue-soft)">예정</span>';
      return '<tr data-kind="plan" data-idx="'+DATA.plans.indexOf(r)+'">'
        + '<td class="col-no">'+(i+1)+'</td>'
        + '<td>'+ptag(r.project)+'</td>'
        + '<td class="t-title">'+esc(r.title)+'</td>'
        + '<td class="t-sub">'+fmtDateDow(r.date)+'</td>'
        + '<td class="t-sub">'+esc(r.location||"-")+'</td>'
        + '<td class="t-sub">'+esc(r.writer||"-")+'</td>'
        + '<td>'+stt+'</td>'
        + '<td class="t-sub">'+esc(r.modified_at||"-")+'</td>'
        + '</tr>';
    }).join("") : '<tr class="empty-row"><td colspan="8">업무계획이 없습니다.</td></tr>';
    return '<div class="card">'
      +'<div class="card-h"><span class="bar" style="background:var(--blue)"></span><h3>업무계획</h3>'
      +'<span class="sub">다음 주 수행할 업무 · '+DATA.plans.length+'건</span>'
      +'<div class="right"><button class="addbtn" data-add="plan">+ 항목 추가</button></div></div>'
      +'<table class="tbl"><thead><tr>'
      +'<th>No</th><th>과제</th><th>제목</th><th>예정일</th><th>장소</th><th>담당자</th><th>상태</th><th>수정일시</th>'
      +'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  document.getElementById("content").addEventListener("click", function(e){
    if(e.target.id==="calPrev"){ VIEW.mo--; if(VIEW.mo<0){VIEW.mo=11;VIEW.y--;} render(); return; }
    if(e.target.id==="calNext"){ VIEW.mo++; if(VIEW.mo>11){VIEW.mo=0;VIEW.y++;} render(); return; }
    // +N건 더보기 → 팝오버
    var more = e.target.closest("[data-more]");
    if(more){ showPopover(more.dataset.more, more); return; }
    // 달력 이벤트 클릭 → 그 날 팝오버
    var ev = e.target.closest("[data-evday]");
    if(ev){ showPopover(ev.dataset.evday, ev); return; }
    var addBtn = e.target.closest("[data-add]");
    if(addBtn){ alert("항목 추가 기능은 다음 단계에서 연결됩니다."); return; }
    var row = e.target.closest("tr[data-kind]");
    if(row){ alert("상세/수정 모달은 다음 단계에서 연결됩니다."); return; }
  });

  function showPopover(ds, anchor){
    var pop = document.getElementById("popover");
    var evs = [];
    DATA.achievements.forEach(function(r){ if(r.date===ds) evs.push({r:r,plan:false}); });
    DATA.plans.forEach(function(r){ if(r.date===ds) evs.push({r:r,plan:true}); });
    if(!evs.length){ pop.classList.remove("open"); return; }
    var p=ds.split("-"); var dObj=new Date(ds+"T00:00:00"); var dows=["일","월","화","수","목","금","토"];
    pop.innerHTML = '<div class="pv-date">'+(+p[1])+'월 '+(+p[2])+'일('+dows[dObj.getDay()]+') · '+evs.length+'건</div>'
      + evs.map(function(e){
          var st=PROJ_STYLE[e.r.project]||PROJ_STYLE["기타"];
          return '<div class="pv-ev" style="background:'+st.bg+'">'
            + '<span class="pv-tag" style="color:'+st.c+';background:var(--surface)">'+esc(e.plan?"계획":"실적")+'</span>'
            + '<span style="color:var(--text)">'+esc(e.r.title||"")+'</span></div>';
        }).join("");
    pop.classList.add("open");
    // 위치: 앵커 근처
    var rect = anchor.getBoundingClientRect();
    var top = rect.bottom + 6, left = rect.left;
    if(left + 320 > window.innerWidth) left = window.innerWidth - 330;
    if(top + 200 > window.innerHeight) top = rect.top - 200;
    pop.style.top = top + "px"; pop.style.left = left + "px";
  }
  // 팝오버 바깥 클릭 시 닫기
  document.addEventListener("click", function(e){
    var pop=document.getElementById("popover");
    if(pop.classList.contains("open") && !pop.contains(e.target) && !e.target.closest("[data-more],[data-evday]")){
      pop.classList.remove("open");
    }
  });

  ["fProject","fOwner","fStatus"].forEach(function(id){
    document.getElementById(id).addEventListener("change", function(){
      FILTER.project = document.getElementById("fProject").value;
      FILTER.owner = document.getElementById("fOwner").value;
      FILTER.status = document.getElementById("fStatus").value;
      render();
    });
  });
  document.getElementById("fReset").addEventListener("click", function(){
    FILTER={project:"",owner:"",status:""};
    document.getElementById("fProject").value="";
    document.getElementById("fOwner").value="";
    document.getElementById("fStatus").value="";
    render();
  });

  document.getElementById("weekPrev").addEventListener("click", function(){ alert("주차 이동은 다음 단계에서 연결됩니다."); });
  document.getElementById("weekNext").addEventListener("click", function(){ alert("주차 이동은 다음 단계에서 연결됩니다."); });
  document.getElementById("pdfBtn").addEventListener("click", function(){ alert("PDF 불러오기는 다음 단계에서 연결됩니다."); });
  document.getElementById("wordBtn").addEventListener("click", function(){ alert("Word 다운로드는 다음 단계에서 연결됩니다."); });
  document.querySelectorAll("[data-todo]").forEach(function(a){ a.addEventListener("click", function(e){ e.preventDefault(); alert("이 페이지는 준비 중입니다."); }); });

  (function(){
    var root=document.documentElement, btn=document.getElementById("themeBtn");
    function set(t){ root.setAttribute("data-theme",t); btn.textContent=(t==="dark"?"☀️ 라이트":"🌙 다크모드");
      try{localStorage.setItem("mbd-theme",t)}catch(e){} }
    var saved; try{saved=localStorage.getItem("mbd-theme")}catch(e){}
    if(!saved){ saved="light"; }
    set(saved);
    btn.addEventListener("click", function(){ set(root.getAttribute("data-theme")==="dark"?"light":"dark"); });
  })();

  load();
</script>
</body>
</html>
